name: Deploy Battle Sim Branch Preview

# Publishes an in-progress branch to its own URL for visual checks:
#   https://test.ivandpopov.com/grasstex/preview/<branch-slug>/battle_sim.php
# Production (/grasstex/battle_sim.php, build tags, deploy hash state) is never touched. A preview reads
# production assets, policy and scenario memory, and makes no telemetry, policy or learning writes.

on:
  push:
    branches:
      - 'work/**'
      - 'preview/**'
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or commit to preview (defaults to the selected branch)
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: deploy-50webs-preview-${{ github.event.inputs.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  preview:
    name: Upload branch preview
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout preview ref
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Resolve preview identity
        id: id
        shell: bash
        env:
          PREVIEW_REF: ${{ github.event.inputs.ref || github.ref_name }}
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          slug="$(printf '%s' "$PREVIEW_REF" | tr '[:upper:]' '[:lower:]' | sed -E 's#^(work|preview)/##; s#[^a-z0-9]+#-#g; s#^-+|-+$##g' | cut -c1-48)"
          test -n "$slug"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "slug=$slug" >> "$GITHUB_OUTPUT"
          echo "ref=$PREVIEW_REF" >> "$GITHUB_OUTPUT"

      - name: Validate preview runtime
        shell: bash
        run: |
          set -euo pipefail
          php -l battle_sim_local.php
          php -l labs/asset-list.php
          # A loader without preview support would silently serve production scripts and write production logs.
          grep -q 'BATTLE_PREVIEW' battle_sim_local.php
          grep -q 'BATTLE_PREVIEW' battle/battle-telemetry.js
          grep -q 'BATTLE_PREVIEW' battle/ai-policy.js
          test -s battle/battle_sim.html
          for f in battle/*.js battle/modules/*.js; do node --check "$f"; done

      - name: Stage preview directory
        shell: bash
        env:
          PREVIEW_REF: ${{ steps.id.outputs.ref }}
          PREVIEW_SHA: ${{ steps.id.outputs.sha }}
        run: |
          set -euo pipefail
          rm -rf .preview && mkdir -p .preview/battle/modules
          cp battle_sim_local.php .preview/battle_sim.php
          cp battle/battle_sim.html battle/*.js .preview/battle/
          cp battle/modules/*.js .preview/battle/modules/
          # The branch's own soldier models and clips; the loader points the FBX backend here.
          for d in soldiers animations weapons; do
            if [ -d "Assets/$d" ]; then mkdir -p ".preview/Assets/$d" && cp "Assets/$d"/*.fbx ".preview/Assets/$d/"; fi
          done
          if [ -d Assets/effects/muzzle-flash ]; then mkdir -p .preview/Assets/effects/muzzle-flash && cp Assets/effects/muzzle-flash/*.png .preview/Assets/effects/muzzle-flash/; fi
          # The Motion Lab workbench with its asset inventory + sidecar-save endpoints.
          if [ -d labs ]; then mkdir -p .preview/labs && cp labs/fbx-animation-lab.html labs/fbx-animation-*.js labs/asset-list.php labs/save-calibration.php .preview/labs/; fi
          # Per-model sidecar calibrations live next to the soldier FBX files.
          for f in Assets/soldiers/*.json; do
            [ -e "$f" ] && mkdir -p .preview/Assets/soldiers && cp Assets/soldiers/*.json .preview/Assets/soldiers/
            break
          done
          # Git-tracked sidecars upload as explicit puts (see below): they are excluded
          # from the Assets mirror, which spares server-tuned *.json from --delete.
          : > .preview-sidecars.lftp
          for f in .preview/Assets/soldiers/*.json; do
            [ -e "$f" ] || continue
            printf 'put "%s" -o "Assets/soldiers/%s"\n' "$GITHUB_WORKSPACE/$f" "$(basename "$f")" >> .preview-sidecars.lftp
          done
          python3 - <<'PY'
          import json, os, datetime
          json.dump({"ref": os.environ["PREVIEW_REF"], "sha": os.environ["PREVIEW_SHA"],
                     "deployedAt": datetime.datetime.utcnow().isoformat() + "Z"},
                    open(".preview/preview.json", "w"))
          PY
          find .preview -type f | wc -l

      - name: Upload preview to 50webs
        shell: bash
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASS }}
          SLUG: ${{ steps.id.outputs.slug }}
        run: |
          set -euo pipefail
          : "${FTP_HOST:?Missing repository secret FTP_HOST}"
          : "${FTP_USER:?Missing repository secret FTP_USER}"
          : "${FTP_PASSWORD:?Missing repository secret FTP_PASS}"
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp
          # Code is tiny: always re-uploaded so an edit can never be missed. Bulk
          # assets (~850 MB of FBX) are compared by size only (--ignore-time): every
          # run re-checkouts and re-copies, so mtimes are always "now" and a time
          # comparison would re-upload every unchanged file on each deploy.
          # mirror --delete is confined to this preview's own directory.
          lftp -u "$FTP_USER","$FTP_PASSWORD" "$FTP_HOST" <<LFTP
          set cmd:fail-exit yes
          set net:max-retries 2
          set net:timeout 15
          set ftp:ssl-allow no
          set ftp:passive-mode true
          cd grasstex
          mkdir -f -p preview/$SLUG
          cd preview/$SLUG
          lcd .preview
          mirror -R --delete --verbose=1 battle battle
          mirror -R --delete --verbose=1 labs labs
          # Sidecar calibrations (*.json) ride along neither way here: git-tracked ones
          # upload as explicit puts below, and ones tuned on the server with
          # Save-to-server survive every deploy (mirror --delete spares excluded files,
          # so without this exclusion each push would wipe them as "extras").
          mirror -R --delete --verbose=1 --ignore-time --exclude '\.json$' Assets Assets
          source "$GITHUB_WORKSPACE/.preview-sidecars.lftp"
          put battle_sim.php
          # preview.json advertises the deployed sha: uploaded last, so a cancelled
          # run can never claim a commit it did not finish deploying.
          put preview.json
          bye
          LFTP

      - name: Verify preview is serving this commit
        shell: bash
        env:
          SLUG: ${{ steps.id.outputs.slug }}
          SHA: ${{ steps.id.outputs.sha }}
        run: |
          set -euo pipefail
          url="https://test.ivandpopov.com/grasstex/preview/$SLUG/battle_sim.php"
          body="$(curl -fsS "$url")"
          grep -q "preview-${SHA:0:7}" <<<"$body"
          grep -q "/grasstex/preview/$SLUG/battle/commander-ai.js" <<<"$body"
          {
            echo "### Battle Sim preview"
            echo "- Ref: \`${{ steps.id.outputs.ref }}\` @ \`${SHA:0:7}\`"
            echo "- Meeting: $url"
            echo "- US defending: $url?defender=us"
            echo "- German defending: $url?defender=ge"
            echo "- Production untouched; preview makes no telemetry, policy or learning writes."
          } >> "$GITHUB_STEP_SUMMARY"

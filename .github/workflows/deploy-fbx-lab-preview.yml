name: Deploy FBX Animation Lab Preview

on:
  push:
    branches:
      - fbx-lab-normalization
    paths:
      - fbx-animation-lab.html
      - fbx-animation-root-lock.js
      - .github/workflows/deploy-fbx-lab-preview.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-fbx-animation-lab-preview
  cancel-in-progress: true

jobs:
  deploy:
    name: Upload FBX animation lab preview
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout preview branch
        uses: actions/checkout@v4
        with:
          ref: fbx-lab-normalization

      - name: Validate preview files
        shell: bash
        run: |
          set -euo pipefail
          test -s fbx-animation-lab.html
          test -s fbx-animation-root-lock.js
          grep -q '<title>FBX Motion Lab</title>' fbx-animation-lab.html
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path('fbx-animation-lab.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', html, re.S | re.I)
          inline = [s for s in scripts if s.strip()]
          if not inline:
              raise SystemExit('No inline JavaScript found')
          Path('/tmp/fbx-animation-lab.js').write_text(inline[-1], encoding='utf-8')
          PY
          node --check /tmp/fbx-animation-lab.js
          node --check fbx-animation-root-lock.js
          echo "Preview source: $(git rev-parse HEAD)"

      - name: Build preview page
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .preview
          python3 - <<'PY'
          from pathlib import Path
          import os

          source = Path('fbx-animation-lab.html').read_text(encoding='utf-8')
          marker = '</body>'
          if marker not in source:
              raise SystemExit('fbx-animation-lab.html is missing </body>')
          sha = os.environ.get('GITHUB_SHA', 'dev')
          include = f'  <script src="fbx-animation-root-lock.js?v={sha}"></script>\n'
          staged = source.replace(marker, include + marker, 1)
          Path('.preview/fbx-animation-lab.html').write_text(staged, encoding='utf-8')
          PY
          cp fbx-animation-root-lock.js .preview/fbx-animation-root-lock.js
          grep -q 'fbx-animation-root-lock.js' .preview/fbx-animation-lab.html

      - name: Install FTP client
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp

      - name: Upload preview only
        shell: bash
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASS }}
        run: |
          set -euo pipefail
          : "${FTP_HOST:?Missing repository secret FTP_HOST}"
          : "${FTP_USER:?Missing repository secret FTP_USER}"
          : "${FTP_PASSWORD:?Missing repository secret FTP_PASS}"

          lftp -u "$FTP_USER","$FTP_PASSWORD" "$FTP_HOST" <<LFTP
          set cmd:fail-exit yes
          set net:max-retries 2
          set net:timeout 15
          set ftp:ssl-allow no
          set ftp:passive-mode true
          cd grasstex/labs
          put "$GITHUB_WORKSPACE/.preview/fbx-animation-lab.html" -o "fbx-animation-lab.html"
          put "$GITHUB_WORKSPACE/.preview/fbx-animation-root-lock.js" -o "fbx-animation-root-lock.js"
          cls -l fbx-animation-lab.html
          cls -l fbx-animation-root-lock.js
          bye
          LFTP

      - name: Deployment summary
        shell: bash
        run: |
          {
            echo "### FBX Animation Lab preview"
            echo ""
            echo "- Source branch: \`fbx-lab-normalization\`"
            echo "- Source commit: \`$(git rev-parse HEAD)\`"
            echo "- Remote page: \`/grasstex/labs/fbx-animation-lab.html\`"
            echo "- Root-lock experiment: \`/grasstex/labs/fbx-animation-root-lock.js\`"
            echo "- Production Battle Sim files: untouched"
          } >> "$GITHUB_STEP_SUMMARY"

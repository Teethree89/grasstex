name: Skeletal Soldier Visual
on:
  workflow_dispatch:
  push:
    branches: [skeletal-soldier-runtime]
    paths:
      - 'battle/**'
      - 'Assets/runtime/**'
      - 'Assets/animations/**'
      - 'Assets/soldiers/**'
      - 'tools/import-mixamo-animation-pack.py'
      - 'scripts/skeletal-soldier-visual-check.mjs'
      - '.github/workflows/skeletal-soldier-visual.yml'
jobs:
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Chromium harness
        run: npm install --no-save playwright && npx playwright install --with-deps chromium
      - name: Start local Battle Sim server
        run: |
          php -S 127.0.0.1:8765 -t .. > /tmp/skeletal-visual-php.log 2>&1 &
          echo $! > /tmp/skeletal-visual-php.pid
          for i in {1..30}; do
            if curl -fsS 'http://127.0.0.1:8765/grasstex/battle_sim_local.php?seed=skeletal-visual-check' >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/skeletal-visual-php.log
          exit 1
      - name: Run skeletal soldier visual harness
        run: node scripts/skeletal-soldier-visual-check.mjs
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: skeletal-soldier-visual-${{ github.run_number }}
          path: artifacts/skeletal-soldier-visual/
          if-no-files-found: warn

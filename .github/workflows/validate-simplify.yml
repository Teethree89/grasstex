name: Validate Simplified Battle Runtime
on:
  push:
    branches: [simplify-v134]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Syntax
        run: |
          node --check battle/modules/16-squad-command.js
          node --check battle/modules/44-combat-mobility.js
          node --check battle/modules/52-movement-execution.js
          node --check tools/ai-sim-harness/harness.js
          node --check tools/ai-sim-harness/lean-runtime-check.js
      - name: Lean ownership regressions
        run: node tools/ai-sim-harness/lean-runtime-check.js
      - name: Engagement harness seeds
        run: |
          for seed in 12345 1 2 3 5 8 13 21; do
            HARNESS_SEED="$seed" node tools/ai-sim-harness/run.js
          done
      - name: Existing geometry and tactical position regressions
        run: |
          node tools/ai-sim-harness/objective-nav-check.js
          node tools/ai-sim-harness/impact-fx-check.js
          node tools/ai-sim-harness/tactical-positions-check.js

name: Validate Simplified Battle Runtime
on:
  pull_request:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Syntax
        run: |
          node --check battle/modules/16-squad-plan-stability.js
          node --check battle/modules/44-assault-forward-guard.js
          node --check battle/modules/52-survival-tactical-route.js
          node --check tools/ai-sim-harness/harness.js
          node --check tools/ai-sim-harness/lean-runtime-check.js
      - name: Lean ownership regressions
        run: node tools/ai-sim-harness/lean-runtime-check.js
      - name: Engagement harness seeds
        run: |
          for seed in 12345 1 2 3 5 8 13 21; do
            HARNESS_SEED="$seed" node tools/ai-sim-harness/run.js
          done
      - name: Existing geometry and tactical position regressions
        run: |
          node tools/ai-sim-harness/objective-nav-check.js
          node tools/ai-sim-harness/impact-fx-check.js
          node tools/ai-sim-harness/tactical-positions-check.js
          node tools/ai-sim-harness/cover-positions-check.js
          node tools/ai-sim-harness/personal-space-check.js
          node tools/ai-sim-harness/world-debug-check.js
      # Movement and Macro-toggle suites. These exist in tools/ai-sim-harness but ran in no
      # workflow, so nothing caught a regression in them before a deploy to main.
      - name: Movement and Macro command regressions
        run: |
          node tools/ai-sim-harness/movement-state-check.js
          node tools/ai-sim-harness/movement-recovery-check.js
          node tools/ai-sim-harness/macro-command-toggle-check.js
      # The M3C ownership gates. These assert the Macro/Meso/Micro boundaries the ownership sweep
      # established -- exactly the invariants a future change is most likely to erode -- and they
      # were running nowhere. All five are plain Node with no dependencies beyond the harness.
      - name: M3C ownership gates
        run: |
          node scripts/check-macro-mission-command.cjs
          node scripts/check-meso-formation-frame-stability.cjs
          node scripts/check-meso-micro-movement-ownership.cjs
          node scripts/check-movement-order-ownership.cjs
          node scripts/check-physical-waypoint-refill.cjs

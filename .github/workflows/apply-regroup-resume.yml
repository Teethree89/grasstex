name: Apply Regroup Resume Fix
on:
  push:
    branches: [simplify-v134]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: simplify-v134
      - name: Patch lean command owner
        run: python3 scripts/patch_regroup_resume.py
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Resume assigned objective after bounded regroup timeout'
          git push origin HEAD:simplify-v134

name: Deploy Battle Runtime to 50webs

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-50webs-battle-runtime
  cancel-in-progress: true

jobs:
  deploy:
    name: Upload Battle Sim AI lab
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Validate deployment files
        shell: bash
        run: |
          set -euo pipefail
          php -l battle_sim_local.php
          php -l battle_log.php
          php -l battle_log_stats.php
          php -l battle_policy.php
          php -l battle_learning.php
          php -l battle_metrics.php
          test -s battle/battle_sim.html

          for f in \
            battle/soldier.js \
            battle/weapons.js \
            battle/terrain-features.js \
            battle/squad-ai.js \
            battle/battle-sim.js \
            battle/acoustics.js \
            battle/scenario-generator.js \
            battle/battle-navigation.js \
            battle/town-objectives.js \
            battle/module-registry.js \
            battle/ai-policy.js \
            battle/objective-system.js \
            battle/battle-telemetry.js \
            battle/commander-ai.js \
            battle/ai-trainer.js \
            battle/battle-control.js; do
            test -s "$f"
            node --check "$f"
          done

          test -d battle/modules
          find battle/modules -maxdepth 1 -type f -name '*.js' -print0 | sort -z | while IFS= read -r -d '' f; do
            test -s "$f"
            node --check "$f"
            echo "Validated module: $f"
          done

          python3 -m json.tool Assets/audio/manifest.json >/dev/null
          python3 scripts/validate_voice_manifest.py Assets/audio/manifest.json Assets/audio
          echo "Deploying commit: $(git rev-parse HEAD)"

      - name: Install FTP and audio tools
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp ffmpeg

      - name: Build pitch-preserving voice variants
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/build_voice_pitch_variants.sh Assets/audio/manifest.json Assets/audio .audio-deploy
          test -s .audio-deploy/manifest.json
          test -d .audio-deploy/voices/us
          test -d .audio-deploy/voices/ge
          echo "Voice deployment files: $(find .audio-deploy/voices -type f -name '*.mp3' | wc -l)"

      - name: Upload runtime to 50webs
        shell: bash
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASS }}
        run: |
          set -euo pipefail
          : "${FTP_HOST:?Missing repository secret FTP_HOST}"
          : "${FTP_USER:?Missing repository secret FTP_USER}"
          : "${FTP_PASSWORD:?Missing repository secret FTP_PASS}"

          lftp -u "$FTP_USER","$FTP_PASSWORD" "$FTP_HOST" <<LFTP
          set cmd:fail-exit yes
          set net:max-retries 2
          set net:timeout 15
          set ftp:ssl-allow no
          set ftp:passive-mode true
          cd grasstex
          put battle_sim_local.php -o battle_sim.php
          put battle_log.php -o battle_log.php
          put battle_log_stats.php -o battle_log_stats.php
          put battle_policy.php -o battle_policy.php
          put battle_learning.php -o battle_learning.php
          put battle_metrics.php -o battle_metrics.php
          cd battle
          put battle/battle_sim.html -o battle_sim.html
          put battle/soldier.js -o soldier.js
          put battle/weapons.js -o weapons.js
          put battle/terrain-features.js -o terrain-features.js
          put battle/squad-ai.js -o squad-ai.js
          put battle/battle-sim.js -o battle-sim.js
          put battle/acoustics.js -o acoustics.js
          put battle/scenario-generator.js -o scenario-generator.js
          put battle/battle-navigation.js -o battle-navigation.js
          put battle/town-objectives.js -o town-objectives.js
          put battle/module-registry.js -o module-registry.js
          put battle/ai-policy.js -o ai-policy.js
          put battle/objective-system.js -o objective-system.js
          put battle/battle-telemetry.js -o battle-telemetry.js
          put battle/commander-ai.js -o commander-ai.js
          put battle/ai-trainer.js -o ai-trainer.js
          put battle/battle-control.js -o battle-control.js
          mirror -R --delete --verbose battle/modules modules
          cd ../Assets/audio
          mirror -R --verbose .audio-deploy/voices voices
          put .audio-deploy/manifest.json -o manifest.json
          cd ../../battle
          cls -l scenario-generator.js
          cls -l battle-navigation.js
          cls -l ai-trainer.js
          cls -l battle-control.js
          cls -l modules
          bye
          LFTP

      - name: Deployment summary
        shell: bash
        run: |
          {
            echo "### 50webs Battle Sim AI lab deployment"
            echo ""
            echo "- Source: \`main@$(git rev-parse --short HEAD)\`"
            echo "- Battle: \`/grasstex/battle_sim.php\`"
            echo "- Review: \`/grasstex/battle_metrics.php\`"
            echo "- Telemetry: \`/grasstex/battle_log.php\`"
            echo "- Aggregate stats: \`/grasstex/battle_log_stats.php\`"
            echo "- Genome state: \`/grasstex/battle_policy.php\`"
            echo "- Scenario memory: \`/grasstex/battle_learning.php\`"
            echo "- Runtime modules: exact mirror of \`/grasstex/battle/modules/\`"
            echo "- Voice manifest: validated against committed neutral/base MP3s"
            echo "- Voice pitch: deterministic low/neutral/high per soldier, duration preserved"
            echo "- Trigger: every push to \`main\` plus manual dispatch"
          } >> "$GITHUB_STEP_SUMMARY"

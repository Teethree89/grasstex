name: Deploy Battle Runtime to 50webs

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-50webs-battle-runtime
  cancel-in-progress: true

jobs:
  deploy:
    name: Upload Battle Sim AI lab
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Validate deployment files
        shell: bash
        run: |
          set -euo pipefail
          php -l battle_sim_local.php
          php -l battle_log.php
          php -l battle_log_stats.php
          php -l battle_policy.php
          php -l battle_learning.php
          php -l battle_metrics.php
          test -s battle/battle_sim.html

          for f in \
            battle/soldier.js \
            battle/weapons.js \
            battle/terrain-features.js \
            battle/squad-ai.js \
            battle/battle-sim.js \
            battle/acoustics.js \
            battle/scenario-generator.js \
            battle/battle-navigation.js \
            battle/town-objectives.js \
            battle/module-registry.js \
            battle/ai-policy.js \
            battle/objective-system.js \
            battle/battle-telemetry.js \
            battle/commander-ai.js \
            battle/ai-trainer.js \
            battle/battle-control.js; do
            test -s "$f"
            node --check "$f"
          done

          test -d battle/modules
          find battle/modules -maxdepth 1 -type f -name '*.js' -print0 | sort -z | while IFS= read -r -d '' f; do
            test -s "$f"
            node --check "$f"
            echo "Validated module: $f"
          done

          python3 -m json.tool Assets/audio/manifest.json >/dev/null
          python3 scripts/validate_voice_manifest.py Assets/audio/manifest.json Assets/audio
          python3 -m py_compile scripts/prepare_incremental_deploy.py
          echo "Deploying commit: $(git rev-parse HEAD)"

      - name: Install FTP and audio tools
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp ffmpeg

      - name: Fetch deployed hash state
        shell: bash
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASS }}
        run: |
          set -u
          : "${FTP_HOST:?Missing repository secret FTP_HOST}"
          : "${FTP_USER:?Missing repository secret FTP_USER}"
          : "${FTP_PASSWORD:?Missing repository secret FTP_PASS}"
          rm -f .deploy-remote.sha256.tsv

          if lftp -u "$FTP_USER","$FTP_PASSWORD" "$FTP_HOST" <<LFTP
          set cmd:fail-exit yes
          set net:max-retries 2
          set net:timeout 15
          set ftp:ssl-allow no
          set ftp:passive-mode true
          cd grasstex
          get .battle-deploy.sha256.tsv -o "$GITHUB_WORKSPACE/.deploy-remote.sha256.tsv"
          bye
          LFTP
          then
            echo "Remote deployment hash state loaded: $(wc -l < .deploy-remote.sha256.tsv) managed entries"
          else
            rm -f .deploy-remote.sha256.tsv
            echo "No usable remote deployment hash state. This run will bootstrap it with one full managed-runtime upload."
          fi

      - name: Inventory deployed voice files
        shell: bash
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASS }}
        run: |
          set -u
          : "${FTP_HOST:?Missing repository secret FTP_HOST}"
          : "${FTP_USER:?Missing repository secret FTP_USER}"
          : "${FTP_PASSWORD:?Missing repository secret FTP_PASS}"
          rm -f .audio-remote-files.txt .audio-remote-files.raw

          if lftp -u "$FTP_USER","$FTP_PASSWORD" "$FTP_HOST" <<'LFTP' > .audio-remote-files.raw
          set cmd:fail-exit yes
          set net:max-retries 2
          set net:timeout 15
          set ftp:ssl-allow no
          set ftp:passive-mode true
          cd grasstex/Assets/audio
          find voices
          bye
          LFTP
          then
            sed -e 's#^\./##' -e 's#/$##' .audio-remote-files.raw \
              | grep '^voices/' \
              | sort -u > .audio-remote-files.txt || true
            echo "Remote voice entries indexed: $(wc -l < .audio-remote-files.txt)"
            echo "Remote MP3s: $(grep -c '\.mp3$' .audio-remote-files.txt || true)"
            echo "Existing pitch variants: $(grep -c '\.pitch-.*\.mp3$' .audio-remote-files.txt || true)"
          else
            echo "Remote voice inventory failed; deploy will safely rebuild/upload staged voice files."
            rm -f .audio-remote-files.txt
          fi

      - name: Build only missing pitch-preserving voice variants
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/build_voice_pitch_variants.sh Assets/audio/manifest.json Assets/audio .audio-deploy .audio-remote-files.txt
          test -s .audio-deploy/manifest.json
          test -d .audio-deploy/voices/us
          test -d .audio-deploy/voices/ge
          echo "Voice files staged: $(find .audio-deploy/voices -type f -name '*.mp3' | wc -l)"
          echo "New pitch variants staged: $(find .audio-deploy/voices -type f -name '*.pitch-*.mp3' | wc -l)"

      - name: Prepare missing-only voice upload
        shell: bash
        run: |
          set -euo pipefail
          : > .audio-upload.lftp
          inventory_available=0
          [[ -f .audio-remote-files.txt ]] && inventory_available=1
          upload_count=0
          skip_count=0

          while IFS= read -r -d '' src; do
            rel="${src#.audio-deploy/}"
            if [[ "$inventory_available" -eq 1 ]] && grep -Fqx "$rel" .audio-remote-files.txt; then
              skip_count=$((skip_count+1))
              continue
            fi
            printf 'put "%s" -o "%s"\n' "$src" "$rel" >> .audio-upload.lftp
            upload_count=$((upload_count+1))
          done < <(find .audio-deploy/voices -type f -name '*.mp3' -print0 | sort -z)

          echo "Voice MP3s already remote / skipped: $skip_count"
          echo "Voice MP3s missing / queued for upload: $upload_count"
          if [[ "$inventory_available" -eq 0 ]]; then
            echo "Remote inventory unavailable: all staged MP3s queued as safe fallback."
          fi

      - name: Prepare content-hash deployment plan
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/prepare_incremental_deploy.py \
            --remote-manifest .deploy-remote.sha256.tsv \
            --audio-manifest .audio-deploy/manifest.json \
            --output .deploy-plan
          cat .deploy-plan/summary.json

      - name: Upload changed runtime to 50webs
        shell: bash
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASS }}
        run: |
          set -euo pipefail
          : "${FTP_HOST:?Missing repository secret FTP_HOST}"
          : "${FTP_USER:?Missing repository secret FTP_USER}"
          : "${FTP_PASSWORD:?Missing repository secret FTP_PASS}"

          lftp -u "$FTP_USER","$FTP_PASSWORD" "$FTP_HOST" <<LFTP
          set cmd:fail-exit yes
          set net:max-retries 2
          set net:timeout 15
          set ftp:ssl-allow no
          set ftp:passive-mode true
          cd grasstex

          source "$GITHUB_WORKSPACE/.deploy-plan/deletes.lftp"
          source "$GITHUB_WORKSPACE/.deploy-plan/uploads.lftp"

          cd Assets/audio
          source "$GITHUB_WORKSPACE/.audio-upload.lftp"
          cd ../..

          source "$GITHUB_WORKSPACE/.deploy-plan/post-uploads.lftp"

          # Publish state last so a failed partial deployment is retried next run.
          put "$GITHUB_WORKSPACE/.deploy-plan/current.sha256.tsv" -o ".battle-deploy.sha256.tsv"

          cd battle
          cls -l scenario-generator.js
          cls -l battle-navigation.js
          cls -l ai-trainer.js
          cls -l battle-control.js
          cls -l modules
          bye
          LFTP

      - name: Deployment summary
        shell: bash
        run: |
          set -euo pipefail
          runtime_uploads="$(python3 -c 'import json; print(json.load(open(".deploy-plan/summary.json"))["runtimeUploads"])')"
          post_uploads="$(python3 -c 'import json; print(json.load(open(".deploy-plan/summary.json"))["postUploads"])')"
          unchanged="$(python3 -c 'import json; print(json.load(open(".deploy-plan/summary.json"))["unchanged"])')"
          deletes="$(python3 -c 'import json; print(json.load(open(".deploy-plan/summary.json"))["deletes"])')"
          {
            echo "### 50webs Battle Sim AI lab deployment"
            echo ""
            echo "- Source: \`main@$(git rev-parse --short HEAD)\`"
            echo "- Battle: \`/grasstex/battle_sim.php\`"
            echo "- Review: \`/grasstex/battle_metrics.php\`"
            echo "- Runtime uploads: **$runtime_uploads**"
            echo "- Post-runtime uploads: **$post_uploads**"
            echo "- Unchanged managed files skipped: **$unchanged**"
            echo "- Managed stale files deleted: **$deletes**"
            echo "- Runtime deploy comparison: SHA-256 content hash, not timestamps"
            echo "- Voice MP3 upload: existence-based; already-deployed MP3s are never re-uploaded"
            echo "- Deployment state: \`/grasstex/.battle-deploy.sha256.tsv\` published last"
            echo "- Trigger: every push to \`main\` plus manual dispatch"
          } >> "$GITHUB_STEP_SUMMARY"

name: Normalize Battle Sim Audio

on:
  workflow_dispatch:
  push:
    # This job ends in `git push origin HEAD:main`. Without a branch filter it fired on
    # feature branches too and published them straight to main - which is how 0ab9b1d, an
    # unreviewed commit on claude/ww2-gun-sounds-f5gmvc, became main at 06:50 on 2026-09-19,
    # about ninety seconds after being pushed to its own branch. main then deploys live.
    # CI now asserts the mastering standard on every pull request, so this workflow is a
    # safety net for main rather than the thing that maintains the invariant.
    branches:
      - main
    paths:
      - 'scripts/normalize_audio.sh'
      - '.github/workflows/normalize-audio.yml'

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Normalize audio library
        run: bash scripts/normalize_audio.sh Assets/audio

      - name: Commit normalized files
        run: |
          if git diff --quiet -- Assets/audio; then
            echo 'No audio changes produced.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Assets/audio
          git commit -m 'Normalize Battle Sim audio loudness [skip ci]'
          git push origin HEAD:main

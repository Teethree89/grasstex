name: Deploy grass demo

on:
  push:
    branches:
      - main
    paths:
      - 'index.html'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Read expected build marker
        id: version
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED="$(grep -oE 'BUILD V[0-9]+' index.html | head -n 1)"
          test -n "$EXPECTED"
          echo "Expected live marker: $EXPECTED"
          echo "expected=$EXPECTED" >> "$GITHUB_OUTPUT"

      - name: Trigger 50webs deploy endpoint
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_TOKEN"

          curl -4 --fail --show-error --silent \
            --connect-timeout 20 \
            --max-time 45 \
            --retry 6 \
            --retry-delay 5 \
            --retry-max-time 240 \
            --retry-all-errors \
            --get \
            --data-urlencode "token=$DEPLOY_TOKEN" \
            "https://test.ivandpopov.com/grasstex/deploy.php"

      - name: Verify public site actually updated
        env:
          EXPECTED: ${{ steps.version.outputs.expected }}
        shell: bash
        run: |
          set -euo pipefail
          echo "Waiting for public site to serve: $EXPECTED"

          for i in $(seq 1 12); do
            URL="https://test.ivandpopov.com/grasstex/?verify=${GITHUB_SHA}-${i}-$(date +%s)"
            echo "Verification attempt $i/12"

            BODY="$(curl -4 --fail --show-error --silent \
              --connect-timeout 15 \
              --max-time 30 \
              --retry 2 \
              --retry-delay 2 \
              --retry-all-errors \
              "$URL" || true)"

            if printf '%s' "$BODY" | grep -Fq "$EXPECTED"; then
              echo "Verified public deployment: $EXPECTED"
              exit 0
            fi

            if [ -n "$BODY" ]; then
              SERVED="$(printf '%s' "$BODY" | grep -oE 'BUILD V[0-9]+' | head -n 1 || true)"
              echo "Public site currently reports: ${SERVED:-no build marker}"
            else
              echo "Public site returned no readable body"
            fi

            sleep 5
          done

          echo "ERROR: deploy endpoint returned successfully, but the public site never served $EXPECTED" >&2
          exit 1

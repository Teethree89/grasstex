name: Deploy grass demo

on:
  push:
    branches:
      - main
    paths:
      - 'index.html'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Trigger 50webs deploy endpoint
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_TOKEN"
          curl --fail --show-error --silent \
            --connect-timeout 10 \
            --max-time 30 \
            --retry 1 \
            --retry-delay 2 \
            --get \
            --data-urlencode "token=$DEPLOY_TOKEN" \
            "https://test.ivandpopov.com/grasstex/deploy.php"

name: Deploy grass demo

on:
  push:
    branches:
      - main
    paths:
      - 'index.html'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger 50webs deploy endpoint
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_TOKEN"

          # 50webs occasionally times out from GitHub-hosted runners.
          # Force IPv4 and retry transient connection failures for a few minutes.
          curl -4 --fail --show-error --silent \
            --connect-timeout 20 \
            --max-time 45 \
            --retry 6 \
            --retry-delay 5 \
            --retry-max-time 240 \
            --retry-all-errors \
            --get \
            --data-urlencode "token=$DEPLOY_TOKEN" \
            "https://test.ivandpopov.com/grasstex/deploy.php"

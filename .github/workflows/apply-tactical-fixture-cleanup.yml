name: Apply Tactical Fixture Cleanup
on:
  push:
    branches: [simplify-v134]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: simplify-v134
      - name: Remove obsolete doctrine dependency from fixture
        run: python3 scripts/patch_tactical_position_fixture.py
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Decouple tactical-position checks from deleted doctrine module'
          git push origin HEAD:simplify-v134

name: CI

# The single gate for pull requests. Before this nothing ran on a PR at all: syntax errors,
# a manifest naming a clip that does not exist, and audio committed off the mastering
# standard all reached main unchallenged.
#
# This also absorbs two workflows that were not doing their jobs. validate-simplify.yml ran
# the AI sim regression suite only on a branch named simplify-v134, which does not exist, so
# that suite had been running nowhere. normalize-audio.yml re-mastered and committed to main,
# which is how 284 pointlessly re-encoded mp3s landed there, and its unfiltered push trigger
# let any branch publish itself to main. The mastering standard is asserted here instead, so
# a pull request has to arrive already correct rather than be silently rewritten afterwards.
#
# Deliberately not absorbed: the deploy workflows, which publish rather than check, and the
# tag-triggered battle benchmarks, which run hundreds of battles across parallel workers and
# have no business on a pull request.

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# A force-push or a quick second push should not leave two runs racing on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JavaScript
        run: |
          set -euo pipefail
          count=0
          while IFS= read -r file; do
            node --check "$file"
            count=$((count+1))
          done < <(git ls-files '*.js' '*.cjs' '*.mjs')
          echo "Parsed $count JavaScript files."

      - name: PHP
        run: |
          set -euo pipefail
          count=0
          while IFS= read -r file; do
            php -l "$file" > /dev/null
            count=$((count+1))
          done < <(git ls-files '*.php')
          echo "Linted $count PHP files."

      - name: Python
        run: |
          set -euo pipefail
          mapfile -t files < <(git ls-files '*.py')
          python3 -m py_compile "${files[@]}"
          echo "Compiled ${#files[@]} Python files."

      - name: Shell
        run: |
          set -euo pipefail
          count=0
          while IFS= read -r file; do
            bash -n "$file"
            count=$((count+1))
          done < <(git ls-files '*.sh')
          echo "Parsed $count shell scripts."

      - name: JSON
        run: |
          set -euo pipefail
          count=0
          while IFS= read -r file; do
            python3 -m json.tool "$file" > /dev/null
            count=$((count+1))
          done < <(git ls-files '*.json')
          echo "Parsed $count JSON files."

  audio:
    name: Audio library
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Voice manifest
        run: python3 scripts/validate_voice_manifest.py

      - name: Clip references
        run: python3 scripts/check_audio_manifest.py

      - name: Slice recipes
        run: |
          set -euo pipefail
          for recipe in scripts/recipes/*.json; do
            python3 scripts/slice_weapon_shots.py "$recipe" --check-only
          done

      # A category with no mastering target is not an error anyone sees: the pass skips the
      # file and moves on, so it ships unmastered. grenades/pin, throw and bounce sat in the
      # manifest in exactly that state. Ask the script itself what each declared path would
      # be mastered as, so its tables stay the single source of truth.
      - name: Every declared category has a mastering target
        run: |
          set -euo pipefail
          python3 -c "
          import json
          m = json.load(open('Assets/audio/manifest.json'))
          paths = {p for g in m['categories'].values() for v in g.values() for p in v}
          print('\n'.join('Assets/audio/' + p for p in sorted(paths)))
          " > "$RUNNER_TEMP/paths.txt"
          xargs -a "$RUNNER_TEMP/paths.txt" bash scripts/normalize_audio.sh --explain \
            | awk '{print $1}' | sort | uniq -c
          echo "A run with no UNCOVERED rows means every declared category is mastered."

      # The check that matters most. Mastering is hash-skipped, so on a tree whose audio is
      # already on standard this re-encodes nothing and cannot produce a diff - which makes
      # it independent of the runner's FFmpeg build. A diff here means either audio was
      # committed without running the mastering pass, or .mastering-state.tsv no longer
      # describes the files beside it. Both are how the library silently drifts off spec.
      - name: Mastering is current
        run: |
          set -euo pipefail
          bash scripts/normalize_audio.sh Assets/audio
          if ! git diff --quiet -- Assets/audio; then
            echo "::error::Committed audio is not on the mastering standard."
            echo "Run 'bash scripts/normalize_audio.sh Assets/audio' and commit the result."
            echo "Files the mastering pass changed:"
            git diff --name-only -- Assets/audio
            exit 1
          fi
          echo "Audio is on standard; the mastering pass changed nothing."

  harness:
    name: Sim regressions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # Lifted from .github/workflows/validate-simplify.yml, which triggered only on a branch
      # named simplify-v134. No such branch exists, so this suite ran nowhere at all. It
      # passes on main and the whole thing takes seconds, so it belongs on every PR.
      - name: Harness syntax
        run: |
          set -euo pipefail
          for file in tools/ai-sim-harness/*.js; do node --check "$file"; done
          echo "Parsed $(ls tools/ai-sim-harness/*.js | wc -l) harness files."

      - name: Regression checks
        run: |
          set -euo pipefail
          # Every check in tools/ai-sim-harness, not just the seven the old workflow named:
          # macro-command-toggle, map-pipeline, movement-recovery and movement-state were
          # never wired to anything.
          for check in tools/ai-sim-harness/*-check.js; do
            echo "--- $(basename "$check")"
            node "$check"
          done

      - name: Engagement harness seeds
        run: |
          set -euo pipefail
          for seed in 12345 1 2 3 5 8 13 21; do
            HARNESS_SEED="$seed" node tools/ai-sim-harness/run.js > /dev/null
          done
          echo "Engagement harness clean across 8 seeds."

  deploy-plan:
    name: Deploy plan
    runs-on: ubuntu-latest
    steps:
      # build_version.py reads build-v<N> tags to work out the next version.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Every runtime the page loads is covered
        run: python3 scripts/check_deploy_coverage.py

      # Sidecar JSON, the FBX soldier-animation lab and anything else the repo does not manage live
      # only on the server; a deploy must never delete or overwrite them.
      - name: Deploy never touches unmanaged server files
        run: python3 scripts/check_deploy_safety.py

      # prepare_incremental_deploy.py fails on any managed file that is missing or empty,
      # so building the plan is itself the check: it proves a real deploy would find
      # everything it intends to upload, including the audio the manifest points at.
      - name: Plan builds against a bare remote
        run: |
          set -euo pipefail
          python3 scripts/build_version.py stamp
          python3 scripts/prepare_incremental_deploy.py \
            --remote-manifest /dev/null \
            --audio-manifest Assets/audio/manifest.json \
            --output "$RUNNER_TEMP/deploy-plan"
          cat "$RUNNER_TEMP/deploy-plan/summary.json"

name: Scan FBX Animation Root Motion

on:
  push:
    branches: [skeletal-soldier-runtime]
    paths:
      - '.github/workflows/scan-animation-root-motion.yml'

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install Blender scan dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq blender python3-numpy
      - name: Scan authored FBX root motion
        shell: bash
        run: |
          cat > /tmp/scan_root_motion.py <<'PY'
          import bpy, math, re
          from pathlib import Path

          def canon(n):
              n = n.split('|')[-1].split(':')[-1].lower()
              n = re.sub(r'^mixamorig', '', n)
              return re.sub(r'[^a-z0-9]', '', n)

          def clear():
              bpy.ops.object.select_all(action='SELECT')
              bpy.ops.object.delete(use_global=False)
              for datablocks in (bpy.data.actions, bpy.data.armatures):
                  for item in list(datablocks):
                      try:
                          datablocks.remove(item)
                      except Exception:
                          pass

          def descendants(bone):
              stack = list(bone.children)
              while stack:
                  item = stack.pop()
                  yield item
                  stack.extend(item.children)

          def choose_root(arm, hips):
              roots = [b for b in arm.data.bones if b.parent is None]
              if not roots:
                  return None
              for b in roots:
                  if canon(b.name) == 'root':
                      return b
              if hips:
                  for b in roots:
                      if hips in set(descendants(b)):
                          return b
              return roots[0]

          def evaluated_track(scene, arm, bone, start, end):
              positions = []
              rotations = []
              for frame in range(int(math.floor(start)), int(math.ceil(end)) + 1):
                  scene.frame_set(frame)
                  bpy.context.view_layer.update()
                  pb = arm.pose.bones.get(bone.name)
                  if pb is None:
                      raise RuntimeError(f'missing pose bone {bone.name}')
                  world = arm.matrix_world @ pb.matrix
                  p = world.translation.copy()
                  q = world.to_quaternion().normalized()
                  positions.append((float(p.x), float(p.y), float(p.z)))
                  rotations.append(q)
              return positions, rotations

          def position_metrics(positions):
              if not positions:
                  return dict(h_net=0.0, h_span=0.0, z_net=0.0, z_span=0.0)
              p0, p1 = positions[0], positions[-1]
              h_net = math.hypot(p1[0] - p0[0], p1[1] - p0[1])
              h_span = 0.0
              for a in positions:
                  for b in positions:
                      h_span = max(h_span, math.hypot(a[0] - b[0], a[1] - b[1]))
              zs = [p[2] for p in positions]
              return dict(
                  h_net=h_net,
                  h_span=h_span,
                  z_net=abs(p1[2] - p0[2]),
                  z_span=max(zs) - min(zs),
              )

          def rotation_metrics(rotations):
              if len(rotations) < 2:
                  return 0.0
              q0, q1 = rotations[0], rotations[-1]
              return math.degrees(q0.rotation_difference(q1).angle)

          src = Path('Assets/animations')
          scene = bpy.context.scene
          errors = 0
          print('ROOT_MOTION_SCAN_V3')
          print('file\tframes\troot_bone\troot_h_net\troot_h_span\troot_z_net\troot_z_span\troot_rot_delta_deg')

          for f in sorted(src.glob('*.fbx')):
              clear()
              try:
                  bpy.ops.import_scene.fbx(
                      filepath=str(f),
                      use_anim=True,
                      automatic_bone_orientation=False,
                      use_prepost_rot=True,
                  )
                  arms = [o for o in scene.objects if o.type == 'ARMATURE']
                  if not arms:
                      raise RuntimeError('no armature')
                  arm = arms[0]
                  action = arm.animation_data and arm.animation_data.action
                  if not action:
                      raise RuntimeError('no action')
                  start, end = action.frame_range
                  hips = next((b for b in arm.data.bones if canon(b.name) == 'hips'), None)
                  root = choose_root(arm, hips)
                  if not root:
                      raise RuntimeError('no root bone')

                  positions, rotations = evaluated_track(scene, arm, root, start, end)
                  m = position_metrics(positions)
                  rd = rotation_metrics(rotations)
                  frame_count = int(round(end - start + 1))
                  print(
                      f'{f.name}\t{frame_count}\t{root.name}'
                      f'\t{m["h_net"]:.6f}\t{m["h_span"]:.6f}'
                      f'\t{m["z_net"]:.6f}\t{m["z_span"]:.6f}'
                      f'\t{rd:.3f}'
                  )
              except Exception as exc:
                  errors += 1
                  print(f'{f.name}\tERROR:{exc}')

          print(f'ROOT_MOTION_SCAN_ERRORS={errors}')
          if errors:
              raise SystemExit(2)
          PY

          blender --background --python /tmp/scan_root_motion.py 2>/tmp/blender.err | tee /tmp/root-motion-scan.txt
          echo '--- ROOT MOTION SCAN START ---'
          sed -n '/ROOT_MOTION_SCAN_V3/,$p' /tmp/root-motion-scan.txt
          echo '--- ROOT MOTION SCAN END ---'

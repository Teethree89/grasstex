name: Apply Meso Fireteam Commitment Fix

# One-shot branch patcher; remove before merging the validated fix.
on:
  push:
    branches:
      - fix/meso-formation-frame-stability
    paths:
      - .github/workflows/apply-meso-frame-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/meso-formation-frame-stability
      - name: Keep fireteam goals committed until arrival
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('battle/modules/16-squad-plan-stability.js')
          s = p.read_text()
          old = "else if(battle.time>=cur.until||dist(cur.anchor,desired)>20){var moved=live&&cur.origin&&dist(live,cur.origin)>=2.5,arrived=live&&dist(live,cur.anchor)<=4.5;if(moved||arrived)cur=sq._fireteamOrders[key]={anchor:copy(desired),origin:copy(live),forward:forward(sq),signature:sig,until:battle.time+TEAM_LEASE,blocked:false};else cur.until=battle.time+TEAM_LEASE;}"
          new = "else if(battle.time>=cur.until||dist(cur.anchor,desired)>20){var arrived=live&&dist(live,cur.anchor)<=4.5;if(arrived)cur=sq._fireteamOrders[key]={anchor:copy(desired),origin:copy(live),forward:forward(sq),signature:sig,until:battle.time+TEAM_LEASE,blocked:false};else cur.until=battle.time+TEAM_LEASE;}"
          if s.count(old) != 1:
              raise SystemExit(f'expected one moving-goal recommit path, found {s.count(old)}')
          s = s.replace(old, new)
          s = s.replace("version:'1.3-m3c-committed-frame'", "version:'1.4-m3c-arrival-commit'")
          p.write_text(s)
          PY
          node --check battle/modules/16-squad-plan-stability.js
          node scripts/check-meso-formation-frame-stability.cjs
      - name: Commit structural fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add battle/modules/16-squad-plan-stability.js
          git commit -m 'Keep fireteam goals committed until arrival'
          git push origin HEAD:fix/meso-formation-frame-stability

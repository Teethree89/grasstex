name: Temporary Export Baked Animations

on:
  push:
    branches:
      - tmp-retarget-export

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract baked animation JSON
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const src = fs.readFileSync('battle/soldier.js', 'utf8');
          const marker = 'root.BattleSoldierAnimationClips=';
          const start = src.indexOf(marker);
          const endMarker = ';\n  /* BAKED_TRACKS_END */';
          const end = src.indexOf(endMarker, start);
          if (start < 0 || end < 0) throw new Error('Baked animation block not found');
          const raw = src.slice(start + marker.length, end);
          const data = JSON.parse(raw);
          fs.writeFileSync('baked-animations.json', JSON.stringify(data, null, 2));
          console.log('clips:', Object.keys(data.clips));
          NODE
      - name: Upload baked animation JSON
        uses: actions/upload-artifact@v4
        with:
          name: baked-animations
          path: baked-animations.json
          if-no-files-found: error

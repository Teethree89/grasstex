name: Temporary hedge browser visual QA

on:
  push:
    branches:
      - fix/hedge-destination-stalls
    paths:
      - .github/workflows/tmp-hedge-visual-qa.yml

jobs:
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/hedge-destination-stalls
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Create deterministic browser visual probe
        run: |
          cat > .tmp-hedge-visual.mjs <<'NODE'
          import { chromium } from 'playwright';
          import fs from 'node:fs';

          const out='reports/hedge-visual';fs.mkdirSync(out,{recursive:true});
          const seed='standard-benchmark-meeting-s1-b0001-0001';
          const url=`http://127.0.0.1:8765/grasstex/battle_sim_local.php?seed=${encodeURIComponent(seed)}`;
          const browser=await chromium.launch({headless:true,args:['--disable-dev-shm-usage','--use-gl=swiftshader','--enable-webgl','--ignore-gpu-blocklist']});
          const browserErrors=[];
          try{
            const page=await browser.newPage({viewport:{width:1440,height:1000},deviceScaleFactor:1});
            page.setDefaultTimeout(120000);
            page.on('pageerror',e=>browserErrors.push(String(e?.stack||e)));
            await page.route('**/*',async route=>{const t=route.request().resourceType();return(t==='media'||t==='font')?route.abort():route.continue();});
            await page.goto(url,{waitUntil:'domcontentloaded',timeout:120000});
            await page.waitForFunction(()=>!!(window.__battle__&&window.BattleNavigationPhysicality?.resolveStandGoal&&window.BABYLON),null,{timeout:120000});

            const result=await page.evaluate(async()=>{
              const root=window,sim=root.__battle__,scene=sim.scene,engine=scene?.getEngine?.(),renderLoop=root.__battleRenderLoop__;
              if(engine&&renderLoop)engine.stopRenderLoop(renderLoop);sim.pause();
              const telemetry=root.BattleTelemetry||null;if(telemetry?.end)try{await telemetry.end(sim,'hedge-visual-start');}catch(_){}
              if(telemetry){telemetry.record=function(){};telemetry.start=function(){};telemetry.ensure=function(){};telemetry.end=async()=>true;telemetry.checkpoint=async()=>true;telemetry.flush=async()=>true;}
              root.BattleSoldierModel?.setImportedEnabled?.(scene,false);

              const P=root.BattleNavigationPhysicality,N=root.BattleNavigation,B=root.BABYLON;
              const hedges=(P.footprints(sim)||[]).filter(h=>String(h?.type||'').toLowerCase()==='hedge'&&h.shape==='obb');
              if(!hedges.length)return{found:false,error:'No hedge OBB footprints in rendered scenario'};
              const p2=v=>({x:+v.x,z:+v.z});
              const d=(a,b)=>Math.hypot(a.x-b.x,a.z-b.z);
              const pathLength=pts=>pts.slice(1).reduce((s,p,i)=>s+d(pts[i],p),0);
              let chosen=null,attempts=[];

              // Controlled visual proof against the real rendered terrain: place a synthetic
              // formation intent in an actual hedge footprint, point command progress through it,
              // then run the shipping endpoint resolver + shipping physical path planner.
              const ordered=hedges.slice().sort((a,b)=>Math.abs((+a.hx||0)-10)-Math.abs((+b.hx||0)-10));
              outer: for(const h of ordered){
                const ux=+h.ux||1,uz=+h.uz||0,ul=Math.hypot(ux,uz)||1,u={x:ux/ul,z:uz/ul};
                const vx=isFinite(+h.vx)?+h.vx:-u.z,vz=isFinite(+h.vz)?+h.vz:u.x,vl=Math.hypot(vx,vz)||1,v={x:vx/vl,z:vz/vl};
                const hz=+h.hz||.5,clear=hz+(+P.routeMargin||1.15)+5.5;
                for(const sign of [1,-1]){
                  const n={x:v.x*sign,z:v.z*sign};
                  const start={x:(+h.x||0)-n.x*clear,z:(+h.z||0)-n.z*clear};
                  const raw={x:+h.x||0,z:+h.z||0};
                  const commandGoal={x:raw.x+n.x*40,z:raw.z+n.z*40};
                  const fake={id:'visual-probe',root:{position:{x:start.x,z:start.z}},squad:{orderAnchor:{x:start.x,z:start.z},objective:commandGoal,state:'advance'}};
                  const endpoint=p2(P.resolveStandGoal(sim,fake,raw));
                  const forward=(endpoint.x-raw.x)*n.x+(endpoint.z-raw.z)*n.z;
                  const directHit=!!P.shapeHit(start,endpoint,h,P.routeMargin);
                  const startClear=N.movementClear(start,start),endClear=N.movementClear(endpoint,endpoint);
                  let route=P.planIngressPath(sim,fake,start,endpoint);route=Array.isArray(route)?route.map(p2):[];
                  const full=[start,...route];
                  const segClear=full.length>1&&full.slice(1).every((p,i)=>N.movementClear(full[i],p));
                  const hedgeClear=full.length>1&&full.slice(1).every((p,i)=>!P.shapeHit(full[i],p,h,P.navMargin));
                  const row={hedgeId:h.id||null,hx:+h.hx||0,hz:+h.hz||0,sign,forward:+forward.toFixed(3),directHit,startClear,endClear,routePoints:route.length,segClear,hedgeClear};
                  attempts.push(row);
                  if(forward>.25&&directHit&&startClear&&endClear&&route.length>=2&&segClear&&hedgeClear){
                    chosen={h,u,v,n,start,raw,endpoint,route,full,row};break outer;
                  }
                }
              }
              if(!chosen)return{found:false,error:'No visually clean cross-hedge route candidate',attempts:attempts.slice(0,30)};

              const {h,u,v,start,raw,endpoint,route,full,row}=chosen;
              const directDistance=d(start,endpoint),routedDistance=pathLength(full);
              const endpointForward=(endpoint.x-raw.x)*chosen.n.x+(endpoint.z-raw.z)*chosen.n.z;
              const rawInside=P.shapeContains(raw,h,P.navMargin);
              const endpointInside=P.shapeContains(endpoint,h,P.navMargin);

              // Non-gameplay QA overlays on the actual Babylon battlefield.
              const groundY=p=>(sim.heightAt?.(p.x,p.z)||0);
              const mk=(name,p,color,diam=1.4)=>{const m=B.MeshBuilder.CreateSphere(name,{diameter:diam,segments:16},scene);m.position.set(p.x,groundY(p)+2.4,p.z);const mat=new B.StandardMaterial(name+'Mat',scene);mat.emissiveColor=color;mat.diffuseColor=color;m.material=mat;return m;};
              mk('qaStart',start,new B.Color3(.15,.45,1),1.5);
              mk('qaRawIntent',raw,new B.Color3(1,.08,.08),1.7);
              mk('qaResolvedEndpoint',endpoint,new B.Color3(.08,1,.2),1.7);
              const toV=p=>new B.Vector3(p.x,groundY(p)+2.15,p.z);
              const routeLine=B.MeshBuilder.CreateLines('qaShippingRoute',{points:full.map(toV)},scene);routeLine.color=new B.Color3(.05,1,1);
              const directLine=B.MeshBuilder.CreateDashedLines('qaBlockedDirect',{points:[toV(start),toV(endpoint)],dashSize:1,gapSize:.7,dashNb:40},scene);directLine.color=new B.Color3(1,.15,.15);
              const hx=+h.hx||.5,hz=+h.hz||.5,c={x:+h.x||0,z:+h.z||0},corners=[
                {x:c.x+u.x*hx+v.x*hz,z:c.z+u.z*hx+v.z*hz},
                {x:c.x-u.x*hx+v.x*hz,z:c.z-u.z*hx+v.z*hz},
                {x:c.x-u.x*hx-v.x*hz,z:c.z-u.z*hx-v.z*hz},
                {x:c.x+u.x*hx-v.x*hz,z:c.z+u.z*hx-v.z*hz}
              ];corners.push(corners[0]);
              const hedgeLine=B.MeshBuilder.CreateLines('qaHedgeFootprint',{points:corners.map(toV)},scene);hedgeLine.color=new B.Color3(1,.55,.03);

              const legend=document.createElement('div');legend.id='qaLegend';legend.style.cssText='position:fixed;left:18px;top:18px;z-index:99999;background:rgba(0,0,0,.78);color:white;padding:12px 14px;border-radius:8px;font:14px/1.45 Arial,sans-serif;max-width:390px;box-shadow:0 4px 16px rgba(0,0,0,.45)';legend.innerHTML='<b>Hedgerow endpoint QA — shipping runtime</b><br><span style="color:#62a1ff">● Blue</span> soldier start &nbsp; <span style="color:#ff4b4b">● Red</span> raw formation slot<br><span style="color:#4dff65">● Green</span> body-clear resolved endpoint<br><span style="color:#33ffff">━━ Cyan</span> physical route &nbsp; <span style="color:#ff8c22">━━ Orange</span> hedge footprint<br><span style="color:#ff6666">- - Red</span> blocked direct line';document.body.appendChild(legend);
              ['hud','hudToggle','animationLab','animationLabToggle','banner'].forEach(id=>document.getElementById(id)?.setAttribute('style','display:none!important'));

              const pts=[...full,...corners,raw,endpoint],xs=pts.map(p=>p.x),zs=pts.map(p=>p.z),minX=Math.min(...xs),maxX=Math.max(...xs),minZ=Math.min(...zs),maxZ=Math.max(...zs),cx=(minX+maxX)/2,cz=(minZ+maxZ)/2,span=Math.max(maxX-minX,maxZ-minZ,14),cy=groundY({x:cx,z:cz})+1.5;
              const cam=scene.activeCamera,target=new B.Vector3(cx,cy,cz),radius=Math.max(38,span*1.65);
              if(cam&&'radius' in cam){cam.target=target;cam.radius=radius;cam.alpha=-Math.PI/2.45;cam.beta=.72;}else if(cam){cam.position=new B.Vector3(cx+radius*.65,cy+radius*.55,cz-radius*.65);cam.setTarget?.(target);}
              scene.render();scene.render();
              root.__hedgeVisualQA={target:{x:cx,y:cy,z:cz},radius};
              return{found:true,seed,hedge:{id:h.id||null,type:h.type,shape:h.shape,x:+h.x,z:+h.z,hx:+h.hx,hz:+h.hz},start,raw,endpoint,route,checks:{rawInside,endpointInside,endpointForward:+endpointForward.toFixed(3),directBlocked:directHit,startClear:row.startClear,endClear:row.endClear,routeSegmentsClear:row.segClear,routeClearsHedge:row.hedgeClear,directDistance:+directDistance.toFixed(3),routedDistance:+routedDistance.toFixed(3),detourExtra:+(routedDistance-directDistance).toFixed(3)},attemptCount:attempts.length};
            });

            fs.writeFileSync(`${out}/visual-result.json`,JSON.stringify({result,browserErrors},null,2)+'\n');
            if(result.found){
              await page.screenshot({path:`${out}/route-oblique.png`});
              await page.evaluate(()=>{const q=window.__hedgeVisualQA,sim=window.__battle__,cam=sim?.scene?.activeCamera,B=window.BABYLON;if(!q||!cam)return;const t=new B.Vector3(q.target.x,q.target.y,q.target.z);if('radius' in cam){cam.target=t;cam.beta=.12;cam.radius=Math.max(q.radius,52);}else{cam.position=new B.Vector3(t.x,t.y+Math.max(q.radius,52),t.z+.01);cam.setTarget?.(t);}sim.scene.render();sim.scene.render();});
              await page.screenshot({path:`${out}/route-topdown.png`});
            }
            console.log('HEDGE_VISUAL_QA '+JSON.stringify(result));
            if(browserErrors.length)throw new Error('Browser exceptions: '+browserErrors.join('\n'));
            if(!result.found)throw new Error(result.error||'No visual QA route found');
            const c=result.checks;
            if(!c.rawInside||c.endpointInside||c.endpointForward<=0||!c.directBlocked||!c.startClear||!c.endClear||!c.routeSegmentsClear||!c.routeClearsHedge)throw new Error('Hedge visual route invariant failed: '+JSON.stringify(c));
          } finally { await browser.close(); }
          NODE
      - name: Check out exact runtime candidate
        run: git checkout --force 03fb72a462ba1ea0e85f6711d878c7f49b096136
      - name: Start local battle server
        run: |
          rm -rf /tmp/battle-www
          mkdir -p /tmp/battle-www
          ln -s "$GITHUB_WORKSPACE" /tmp/battle-www/grasstex
          php -S 127.0.0.1:8765 -t /tmp/battle-www >/tmp/hedge-visual-php.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS "http://127.0.0.1:8765/grasstex/battle_sim_local.php?seed=healthcheck" >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/hedge-visual-php.log
          exit 1
      - name: Run real browser hedge visual probe
        run: node .tmp-hedge-visual.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hedge-browser-visual-qa
          path: reports/hedge-visual/
          retention-days: 14

name: Apply Lean Module Cleanup
on:
  push:
    branches: [simplify-v134]
permissions:
  contents: write
jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: simplify-v134
      - name: Collapse superseded module files
        run: python3 scripts/apply_lean_module_cleanup.py
      - name: Commit cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Collapse tactical patch stack into three lean owners'
          git push origin HEAD:simplify-v134

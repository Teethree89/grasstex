name: Temporary physical navigation patch

on:
  push:
    branches:
      - fix/meso-formation-frame-stability
    paths:
      - .github/workflows/tmp-nav-refill-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/meso-formation-frame-stability
      - name: Remove redundant base next-waypoint cache from physical runtime
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('battle/modules/39-navigation-physicality-debug.js')
          s=p.read_text()
          old="""  var base=baseNextWaypoint(sim,soldier,dest)||dest;\n  if(!soldier||!soldier.root||!dest)return base;\n  var start={x:+soldier.root.position.x,z:+soldier.root.position.z},finalGoal=point(dest);if(!finalGoal)return base;"""
          new="""  /* Normal physical routing owns its rolling waypoint queue and calls baseFindPath only when\n     building/door topology is actually needed. Maintaining the base nextWaypoint cache in parallel\n     was duplicate planning work; retain it only as the malformed-call fallback. */\n  if(!soldier||!soldier.root||!dest)return baseNextWaypoint(sim,soldier,dest)||dest;\n  var start={x:+soldier.root.position.x,z:+soldier.root.position.z},finalGoal=point(dest);\n  if(!finalGoal)return baseNextWaypoint(sim,soldier,dest)||dest;"""
          if old not in s:
              raise SystemExit('expected base nextWaypoint block not found')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
          node --check battle/modules/39-navigation-physicality-debug.js
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add battle/modules/39-navigation-physicality-debug.js
          git commit -m 'Avoid duplicate base waypoint planning in physical navigation'
          git push origin HEAD:fix/meso-formation-frame-stability

name: Temporary hedge endpoint ownership patch

on:
  push:
    branches:
      - fix/hedge-destination-stalls
    paths:
      - .github/workflows/tmp-nav-refill-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/hedge-destination-stalls
      - name: Apply endpoint ownership fix
        run: |
          echo '' | base64 -d > /tmp/hedge-endpoint-patch.py
          python /tmp/hedge-endpoint-patch.py
          node --check battle/modules/39-navigation-physicality-debug.js
          node --check battle/movement-resolver.js
          node --check tools/ai-sim-harness/objective-nav-check.js
          node tools/ai-sim-harness/objective-nav-check.js
          node tools/ai-sim-harness/movement-state-check.js
          node tools/ai-sim-harness/movement-recovery-check.js
          node tools/ai-sim-harness/lean-runtime-check.js
      - name: Commit validated endpoint ownership fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add battle/modules/39-navigation-physicality-debug.js battle/movement-resolver.js tools/ai-sim-harness/objective-nav-check.js
          git commit -m 'Keep blocked formation intent moving through hedgerows'
          git push origin HEAD:fix/hedge-destination-stalls

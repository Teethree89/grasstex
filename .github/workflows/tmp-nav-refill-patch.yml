name: Temporary hedge baseline validation

on:
  push:
    branches:
      - fix/hedge-destination-stalls
    paths:
      - .github/workflows/tmp-nav-refill-patch.yml

jobs:
  baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/hedge-destination-stalls
      - name: Run unchanged branch regression baseline
        run: |
          set +e
          {
            echo '--- movement state baseline ---'
            node tools/ai-sim-harness/movement-state-check.js; echo "movement-state-status=$?"
            echo '--- movement recovery baseline ---'
            node tools/ai-sim-harness/movement-recovery-check.js; echo "movement-recovery-status=$?"
            echo '--- objective/nav baseline ---'
            node tools/ai-sim-harness/objective-nav-check.js; echo "objective-nav-status=$?"
            echo '--- lean runtime baseline ---'
            node tools/ai-sim-harness/lean-runtime-check.js; echo "lean-runtime-status=$?"
          } > hedge-baseline-validation.log 2>&1
          cat hedge-baseline-validation.log
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: hedge-baseline-validation
          path: hedge-baseline-validation.log

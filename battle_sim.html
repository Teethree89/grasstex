<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>WW2 Battle Sim — loading</title></head><body><div id="boot" style="font-family:Arial,sans-serif;color:#fff;background:#0f141c;position:fixed;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px">Loading battle sim…</div><script>(async()=>{
/* Same self-fetching shape as index.html/game.html: this file is the only thing that has to
   live on the static host. It pulls the real page (battle/battle_sim.html), its five
   battle/*.js scripts, and the four weapon sounds straight from GitHub at load time, so
   pushing to `main` is enough to update what visitors see here - nothing else ever needs
   re-uploading.

   The real page's relative <script src="soldier.js"> tags resolve against wherever THIS file
   is hosted, not against the git repo, so on a host that doesn't also have those files (every
   host but a raw GitHub checkout) they'd 404. Rather than rewrite src attributes to absolute
   raw.githubusercontent.com URLs (and fight classic-script MIME sniffing on files GitHub
   serves as text/plain), this fetches all five as text and inlines them as one <script>
   block in the same spot, exactly like game.html already does for its own scripts.

   Audio is deliberately handled differently from the old BATTLE_AUDIO_BASE approach. The
   loader fetches each MP3 itself as bytes, turns it into a same-page blob: URL, and rewrites
   battle-sim.js's one sound-URL expression to prefer that preloaded blob. That means Babylon
   never has to perform a second cross-origin media request or race its decoder against the
   first shots of the battle; by the time the real page boots, every weapon sample is already
   fully downloaded and local to the page. */
const REPO='https://raw.githubusercontent.com/Teethree89/grasstex/';
/* ?ref= overrides for testing a branch live before it merges to main - e.g.
   battle_sim.html?ref=claude/model-lab-runners-commits-b9s5ll */
const REF=new URLSearchParams(location.search).get('ref')||'main';
const urlFor=(path)=>REPO+REF+'/'+path+'?ts='+Date.now();
const grab=async(path)=>{
  const r=await fetch(urlFor(path),{cache:'no-store'});
  if(!r.ok)throw new Error(path+' -> HTTP '+r.status);
  return r.text();
};
const grabAudio=async(file)=>{
  const path='battle/audio/'+file;
  const r=await fetch(urlFor(path),{cache:'no-store',mode:'cors'});
  if(!r.ok)throw new Error(path+' -> HTTP '+r.status);
  const bytes=await r.arrayBuffer();
  if(!bytes.byteLength)throw new Error(path+' -> empty response');
  return URL.createObjectURL(new Blob([bytes],{type:'audio/mpeg'}));
};
/* Built from split pieces rather than the closing script-tag text written out whole - this
   whole thing sits inside a script block of its own, and the HTML parser ends that block at
   the first literal occurrence of those bytes it finds, with no idea it's inside a JS string
   (or, as a first draft of this very comment proved, inside a comment). Game.html hits the
   same wall and splits the same way (see its closeScript/openScript). */
const ET='</scr'+'ipt>',OT='<scr'+'ipt>';
const OLD_SCRIPTS='<script src="soldier.js">'+ET+'\n<script src="weapons.js">'+ET+'\n<script src="terrain-features.js">'+ET+'\n<script src="squad-ai.js">'+ET+'\n<script src="battle-sim.js">'+ET;
const SOUND_EXPR='audioBase+SFX_FILES[kind]';
try{
  const [html,soldier,weapons,terrainFeatures,squadAi,battleSimRaw,audioUrls]=await Promise.all([
    grab('battle/battle_sim.html'),
    grab('battle/soldier.js'),
    grab('battle/weapons.js'),
    grab('battle/terrain-features.js'),
    grab('battle/squad-ai.js'),
    grab('battle/battle-sim.js'),
    Promise.all(['rifle.mp3','carbine.mp3','lmg.mp3','pistol.mp3'].map(async(file)=>[file,await grabAudio(file)]))
  ]);
  if(html.indexOf(OLD_SCRIPTS)<0)
    throw new Error('battle/battle_sim.html script tags changed shape; refusing to boot with stale inlining');
  if(battleSimRaw.indexOf(SOUND_EXPR)<0)
    throw new Error('battle/battle-sim.js sound URL expression changed shape; refusing to boot with stale audio rewrite');
  window.BATTLE_AUDIO_URLS=Object.fromEntries(audioUrls);
  window.__battleAudioBlobUrls=Object.values(window.BATTLE_AUDIO_URLS);
  window.addEventListener('unload',()=>window.__battleAudioBlobUrls.forEach(URL.revokeObjectURL),{once:true});
  const battleSim=battleSimRaw.replace(SOUND_EXPR,"(window.BATTLE_AUDIO_URLS&&window.BATTLE_AUDIO_URLS[SFX_FILES[kind]])||(audioBase+SFX_FILES[kind])");
  const inlined=OT+soldier+';\n'+weapons+';\n'+terrainFeatures+';\n'+squadAi+';\n'+battleSim+ET;
  const page=html.replace(OLD_SCRIPTS,inlined);
  /* Keep the old base as a fallback for direct code paths and easier console debugging. The
     normal weapon-sound path above will use the preloaded blob URLs first. */
  window.BATTLE_AUDIO_BASE=REPO+REF+'/battle/audio/';
  document.open();document.write(page);document.close();
}catch(e){
  document.getElementById('boot').textContent='Battle sim failed to load ('+REF+'): '+(e.message||e);
}
})();</script></body></html>

<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>WW2 Battle Sim — loading</title><script>if(location.protocol==='http:'&&location.hostname!=='localhost'&&location.hostname!=='127.0.0.1'){location.replace('https://'+location.host+location.pathname+location.search+location.hash);}</script></head><body><div id="boot" style="font-family:Arial,sans-serif;color:#fff;background:#0f141c;position:fixed;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px">Loading battle sim v9…</div><script>(async()=>{
/* v9 keeps the v8 audio scheduling/acoustics and adds the terrain deformation fix in the
   live battle page. Binary assets use the same explicit HTTPS deployment base as game. */
const REPO='https://raw.githubusercontent.com/Teethree89/grasstex/';
const REF=new URLSearchParams(location.search).get('ref')||'main';
const BUILD='v9';
const ASSETS='https://test.ivandpopov.com/grasstex/Assets/';
const AUDIO=ASSETS+'audio/';
const grab=async(path)=>{const r=await fetch(REPO+REF+'/'+path+'?ts='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error(path+' -> HTTP '+r.status);return r.text();};
const probe=async(url)=>{try{const r=await fetch(url+'?probe='+Date.now(),{cache:'no-store'});return {url:url,ok:r.ok,status:r.status,type:r.headers.get('content-type')||''};}catch(e){return {url:url,ok:false,status:'fetch-error',type:'',error:String(e&&e.message||e)};}};
const ET='</scr'+'ipt>',OT='<scr'+'ipt>';
const OLD_SCRIPTS='<script src="soldier.js">'+ET+'\n<script src="weapons.js">'+ET+'\n<script src="terrain-features.js">'+ET+'\n<script src="squad-ai.js">'+ET+'\n<script src="battle-sim.js">'+ET;
try{
  const [html,soldier,weapons,terrainFeatures,squadAi,battleSimRaw,assetProbe]=await Promise.all([
    grab('battle/battle_sim.html'),grab('battle/soldier.js'),grab('battle/weapons.js'),grab('battle/terrain-features.js'),grab('battle/squad-ai.js'),grab('battle/battle-sim.js'),
    Promise.all([ASSETS+'dirttex.png',ASSETS+'skytex.png',AUDIO+'rifle.mp3',AUDIO+'carbine.mp3',AUDIO+'lmg.mp3',AUDIO+'pistol.mp3'].map(probe))
  ]);
  if(html.indexOf(OLD_SCRIPTS)<0)throw new Error('battle/battle_sim.html script tags changed shape; refusing to boot with stale inlining');

  const oldFire="this.onFire=function(soldier){\n      var pos=muzzleWorld(soldier);\n      spawnMuzzleFlash(self.scene,pos);\n      audio.play(soldier.weapon.kind,pos);\n    };";
  const newFire="this.onFire=function(soldier){\n      var pos=muzzleWorld(soldier);\n      spawnMuzzleFlash(self.scene,pos);\n      if(window.BattleAudioScheduler)window.BattleAudioScheduler.enqueue(audio,soldier.weapon.kind,pos,self.scene.activeCamera);\n      else audio.play(soldier.weapon.kind,pos,.18,1);\n    };";
  if(battleSimRaw.indexOf(oldFire)<0)throw new Error('battle audio hook changed shape; refusing stale v9 patch');
  let battleSim=battleSimRaw.replace(oldFire,newFire);
  battleSim=battleSim.replace("maxDistance:260,rolloffFactor:1,volume:.5","maxDistance:145,rolloffFactor:1.5,volume:.20");
  battleSim=battleSim.replace("play:function(kind,position){\n        var voices=pools[kind];if(!voices)return;\n        var voice=voices[cursors[kind]];cursors[kind]=(cursors[kind]+1)%voices.length;\n        try{voice.setPosition(position);voice.play();}catch(_){/* audio context not unlocked yet */}\n      }","play:function(kind,position,gain,rate){\n        var voices=pools[kind];if(!voices)return;\n        var voice=voices[cursors[kind]];cursors[kind]=(cursors[kind]+1)%voices.length;\n        try{\n          voice.setPosition(position);\n          if(voice.setVolume)voice.setVolume(gain==null?.18:gain);\n          if(voice.setPlaybackRate)voice.setPlaybackRate(rate||1);\n          voice.play();\n        }catch(_){/* audio context not unlocked yet */}\n      }");

  const scheduler=`
window.BattleAudioScheduler=(function(){
  var q=[],running=false,recentFar={};
  var MAX_PER_FRAME=2,MAX_QUEUE=14,FAR_START=95,FAR_DROP=195;
  function cameraPos(cam){return cam&&(cam.globalPosition||cam.position)||null;}
  function dist(a,b){if(!a||!b)return 0;var dx=a.x-b.x,dy=a.y-b.y,dz=a.z-b.z;return Math.sqrt(dx*dx+dy*dy+dz*dz);}
  function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
  function acoustics(d){var t=clamp(d/FAR_DROP,0,1);return {gain:.20*(1-.72*t),rate:1-.055*t};}
  function push(audio,kind,pos,due,gain,rate,echo){if(q.length>=MAX_QUEUE){var drop=-1;for(var i=0;i<q.length;i++){if(q[i].echo){drop=i;break;}}if(drop>=0)q.splice(drop,1);else q.shift();}q.push({audio:audio,kind:kind,pos:pos.clone?pos.clone():{x:pos.x,y:pos.y,z:pos.z},due:due,gain:gain,rate:rate,echo:!!echo});}
  function enqueue(audio,kind,pos,cam){var cp=cameraPos(cam),d=dist(cp,pos),now=performance.now();if(d>FAR_DROP)return;if(d>150&&Math.random()<.82)return;if(d>FAR_START){var last=recentFar[kind]||0;if(now-last<55)return;recentFar[kind]=now;}var a=acoustics(d);push(audio,kind,pos,now+Math.random()*26,a.gain,a.rate,false);if(d>65){var chance=d>130?.34:.18;if(Math.random()<chance){var delay=95+d*.65+Math.random()*65;push(audio,kind,pos,now+delay,a.gain*(d>130?.16:.11),Math.max(.90,a.rate-.035),true);}}if(!running){running=true;requestAnimationFrame(drain);}}
  function drain(){var now=performance.now(),started=0,remain=[];for(var i=0;i<q.length;i++){var e=q[i];if(started<MAX_PER_FRAME&&e.due<=now){try{e.audio.play(e.kind,e.pos,e.gain,e.rate);}catch(_){}started++;}else remain.push(e);}q=remain;if(q.length)requestAnimationFrame(drain);else running=false;}
  return {enqueue:enqueue,get queued(){return q.length;}};
})();`;

  const inlined=OT+scheduler+';\n'+soldier+';\n'+weapons+';\n'+terrainFeatures+';\n'+squadAi+';\n'+battleSim+ET;
  const page=html.replace(OLD_SCRIPTS,inlined);
  window.BATTLE_BUILD=BUILD;window.BATTLE_REF=REF;window.BATTLE_ASSET_BASE=ASSETS;window.BATTLE_AUDIO_BASE=AUDIO;window.BATTLE_ASSET_PROBE=assetProbe;
  document.open();document.write(page);document.close();
}catch(e){document.getElementById('boot').textContent='Battle sim '+BUILD+' failed to load ('+REF+'): '+(e.message||e);}
})();</script></body></html>

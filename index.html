<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Grass Demo v16</title><style>html,body{margin:0;width:100%;height:100%;background:#0f141c;color:#fff;font-family:Arial,sans-serif}#load{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:28px;box-sizing:border-box}.loader{width:min(420px,82vw);text-align:center}.title{font-size:24px;margin-bottom:18px}.track{height:10px;border-radius:999px;background:rgba(255,255,255,.14);overflow:hidden;border:1px solid rgba(255,255,255,.12)}#fill{height:100%;width:4%;background:#fff;border-radius:999px;transition:width .22s ease}.meta{margin-top:10px;font-size:13px;color:rgba(255,255,255,.68)}#pct{font-variant-numeric:tabular-nums}</style></head><body><div id="load"><div class="loader"><div class="title" id="loadText">Loading v16 bodycam build…</div><div class="track"><div id="fill"></div></div><div class="meta"><span id="stage">Connecting to GitHub</span> · <span id="pct">4%</span></div></div></div><script>(async()=>{const fill=document.getElementById('fill'),pct=document.getElementById('pct'),stage=document.getElementById('stage'),loadText=document.getElementById('loadText');let shown=4,target=4;const setProgress=(n,s)=>{target=Math.max(target,Math.min(100,n));if(s)stage.textContent=s};const timer=setInterval(()=>{if(shown<target)shown=Math.min(target,shown+2);else if(shown<68)shown+=.35;fill.style.width=shown+'%';pct.textContent=Math.floor(shown)+'%'},45);try{setProgress(12,'Fetching world build');const coreUrl='https://raw.githubusercontent.com/Teethree89/grasstex/bcd3d757ccd4979a02561601908073f42d844a04/index.html?ts='+Date.now();const camUrl='https://raw.githubusercontent.com/Teethree89/grasstex/main/bodycam.js?ts='+Date.now();const [coreRes,camRes]=await Promise.all([fetch(coreUrl,{cache:'no-store'}),fetch(camUrl,{cache:'no-store'})]);if(!coreRes.ok||!camRes.ok)throw new Error('GitHub fetch failed');setProgress(72,'Downloading build');let html=await coreRes.text();setProgress(82,'Loading bodycam camera');const cam=await camRes.text();setProgress(90,'Preparing scene');html=html.replace('<strong>Version:</strong> v15','<strong>Version:</strong> v16').replace('<strong>Build:</strong> deterministic-world-chunks','<strong>Build:</strong> deterministic-world-chunks + bodycam-camera').replace('</body></html>','<script>'+cam.replace(/<\\/script/gi,'<\\/script')+'<\\/script></body></html>');setProgress(100,'Starting renderer');shown=100;fill.style.width='100%';pct.textContent='100%';clearInterval(timer);setTimeout(()=>{document.open();document.write(html);document.close()},140)}catch(e){clearInterval(timer);fill.style.width='100%';fill.style.background='#c96a6a';loadText.textContent='v16 load failed';stage.textContent=e.message;pct.textContent='';}})();</script></body></html>

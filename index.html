<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Babylon Grass Demo</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<style>
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#0f141c;font-family:Arial,sans-serif}
#renderCanvas{width:100%;height:100%;display:block;touch-action:none}
#ui{position:absolute;top:12px;left:12px;z-index:10;color:white;background:rgba(10,15,12,.74);border:1px solid rgba(255,255,255,.16);border-radius:14px;padding:14px;min-width:280px;max-width:min(88vw,360px);backdrop-filter:blur(8px)}
#ui h3{margin:0 0 10px;font-size:20px}#ui .row{margin:10px 0;font-size:14px}#ui label{display:block;margin-bottom:4px;font-weight:600}#ui input[type=range]{width:100%}#ui button{padding:8px 12px;border-radius:10px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.12);color:white;cursor:pointer}
#status{color:#dce6da;font-size:13px;opacity:.95;line-height:1.4}#barTrack{height:10px;width:100%;background:rgba(255,255,255,.16);border-radius:999px;overflow:hidden;margin-top:8px}#barFill{height:100%;width:0;background:#7dc957;transition:width .08s linear}
#fps,#fullscreenBtn{position:absolute;right:12px;z-index:10;color:white;background:rgba(10,15,12,.74);border:1px solid rgba(255,255,255,.16);border-radius:10px;padding:8px 10px;font-size:14px}#fps{top:12px}#fullscreenBtn{top:58px;padding:10px 12px;cursor:pointer}
#help{position:absolute;left:12px;bottom:12px;z-index:10;color:white;background:rgba(10,15,12,.74);border:1px solid rgba(255,255,255,.16);border-radius:10px;padding:10px 12px;font-size:13px;line-height:1.4;max-width:60vw}
#pad{position:absolute;right:12px;bottom:12px;z-index:10;display:grid;grid-template-columns:56px 56px 56px;grid-template-rows:56px 56px;gap:6px}#pad button{border:1px solid rgba(255,255,255,.22);border-radius:12px;background:rgba(10,15,12,.74);color:white;font-size:22px;font-weight:bold;cursor:pointer;touch-action:none}#pad .up{grid-column:2;grid-row:1}#pad .left{grid-column:1;grid-row:2}#pad .down{grid-column:2;grid-row:2}#pad .right{grid-column:3;grid-row:2}
</style>
</head>
<body>
<canvas id="renderCanvas"></canvas>
<div id="ui">
<h3>Grass Field Demo</h3>
<div class="row"><strong>Camera:</strong> eye height ~1.9 m</div>
<div class="row"><label for="density">Density (<span id="densityLabel">50,000</span>)</label><input id="density" type="range" min="5000" max="450000" step="5000" value="50000" /></div>
<div class="row"><label for="wind">Wind Strength</label><input id="wind" type="range" min="0" max="1.5" step="0.05" value="0.45" /></div>
<div class="row"><button id="resetBtn">Reset View</button></div>
<div id="status">Loading…</div><div id="barTrack"><div id="barFill"></div></div>
</div>
<div id="fps">FPS: --</div><button id="fullscreenBtn">Fullscreen</button>
<div id="help"><div><strong>Desktop:</strong> WASD + drag mouse</div><div><strong>Phone:</strong> drag to look + arrow buttons</div></div>
<div id="pad"><button class="up" data-move="forward">▲</button><button class="left" data-move="left">◀</button><button class="down" data-move="back">▼</button><button class="right" data-move="right">▶</button></div>
<script src="https://cdn.jsdelivr.net/npm/babylonjs@8.26.0/babylon.js"></script>
<script src="https://cdn.jsdelivr.net/npm/babylonjs-materials@8.26.0/babylonjs.materials.min.js"></script>
<script>
if(location.protocol==="http:"){location.replace("https://"+location.host+location.pathname+location.search+location.hash);}
const TEXTURE_URL="https://test.ivandpopov.com/grasstex/Assets/grasstex.png";const GROUND_TEXTURE_URL="https://test.ivandpopov.com/grasstex/Assets/filltex.png";const WIDE_TEXTURE_URL="https://test.ivandpopov.com/grasstex/Assets/widetex.png";
const MAX_GRASS=450000,START_GRASS=50000;
const canvas=document.getElementById("renderCanvas"),densityEl=document.getElementById("density"),densityLabelEl=document.getElementById("densityLabel"),windEl=document.getElementById("wind"),resetBtn=document.getElementById("resetBtn"),fullscreenBtn=document.getElementById("fullscreenBtn"),fpsEl=document.getElementById("fps"),statusEl=document.getElementById("status"),barFill=document.getElementById("barFill");
const engine=new BABYLON.Engine(canvas,true,{antialias:true,preserveDrawingBuffer:false,stencil:false});
const scene=new BABYLON.Scene(engine);scene.clearColor=new BABYLON.Color4(.54,.72,.85,1);scene.fogMode=BABYLON.Scene.FOGMODE_EXP2;scene.fogDensity=.0038;scene.fogColor=new BABYLON.Color3(.54,.72,.85);
const camera=new BABYLON.FreeCamera("camera",new BABYLON.Vector3(0,1.9,-8),scene);camera.minZ=.05;camera.maxZ=600;camera.speed=.4;camera.angularSensibility=4000;camera.keysUp=[87];camera.keysDown=[83];camera.keysLeft=[65];camera.keysRight=[68];camera.attachControl(canvas,true);
const hemi=new BABYLON.HemisphericLight("hemi",new BABYLON.Vector3(.15,1,.2),scene);hemi.intensity=.9;hemi.groundColor=new BABYLON.Color3(.12,.16,.06);const sun=new BABYLON.DirectionalLight("sun",new BABYLON.Vector3(-.5,-1,.25),scene);sun.intensity=.7;
const ground=BABYLON.MeshBuilder.CreateGround("ground",{width:500,height:500,subdivisions:2},scene);const groundMat=new BABYLON.StandardMaterial("groundMat",scene);const groundTexture=new BABYLON.Texture(GROUND_TEXTURE_URL,scene,true,false,BABYLON.Texture.TRILINEAR_SAMPLINGMODE);groundTexture.wrapU=BABYLON.Texture.WRAP_ADDRESSMODE;groundTexture.wrapV=BABYLON.Texture.WRAP_ADDRESSMODE;groundTexture.uScale=90;groundTexture.vScale=90;groundTexture.anisotropicFilteringLevel=8;groundMat.diffuseTexture=groundTexture;groundMat.diffuseColor=new BABYLON.Color3(.78,.86,.70);groundMat.specularColor=BABYLON.Color3.Black();ground.material=groundMat;
const wideCard1=BABYLON.MeshBuilder.CreatePlane("wideCard1",{width:3.2,height:.42,sideOrientation:BABYLON.Mesh.DOUBLESIDE},scene);wideCard1.position.y=.21;const wideCard2=wideCard1.clone("wideCard2");wideCard2.rotation.y=Math.PI/2;const wideGrass=BABYLON.Mesh.MergeMeshes([wideCard1,wideCard2],true,true,undefined,false,true);wideGrass.isPickable=false;wideGrass.alwaysSelectAsActiveMesh=true;wideGrass.billboardMode=BABYLON.Mesh.BILLBOARDMODE_Y;const wideTexture=new BABYLON.Texture(WIDE_TEXTURE_URL,scene,true,false,BABYLON.Texture.TRILINEAR_SAMPLINGMODE);wideTexture.hasAlpha=true;wideTexture.wrapU=BABYLON.Texture.CLAMP_ADDRESSMODE;wideTexture.wrapV=BABYLON.Texture.CLAMP_ADDRESSMODE;wideTexture.anisotropicFilteringLevel=8;const wideMat=new BABYLON.StandardMaterial("wideGrassMat",scene);wideMat.diffuseTexture=wideTexture;wideMat.useAlphaFromDiffuseTexture=true;wideMat.transparencyMode=BABYLON.Material.MATERIAL_ALPHATEST;wideMat.alphaCutOff=.12;wideMat.backFaceCulling=false;wideMat.specularColor=BABYLON.Color3.Black();wideMat.emissiveColor=new BABYLON.Color3(.01,.018,.003);wideGrass.material=wideMat;let wideSeed=731;function wideRand(){wideSeed=(wideSeed*1664525+1013904223)>>>0;return wideSeed/4294967296;}const WIDE_COUNT=16000;const wideMatrices=new Float32Array(WIDE_COUNT*16);const wm=new BABYLON.Matrix(),ws=new BABYLON.Vector3(),wq=new BABYLON.Quaternion(),wp=new BABYLON.Vector3();for(let i=0;i<WIDE_COUNT;i++){const x=(wideRand()-.5)*480,z=(wideRand()-.5)*480,sx=.75+wideRand()*.9,sy=.75+wideRand()*.45;ws.set(sx,sy,sx);BABYLON.Quaternion.RotationYawPitchRollToRef(wideRand()*Math.PI*2,0,0,wq);wp.set(x,0,z);BABYLON.Matrix.ComposeToRef(ws,wq,wp,wm);wm.copyToArray(wideMatrices,i*16);}wideGrass.thinInstanceSetBuffer("matrix",wideMatrices,16,true);
const card1=BABYLON.MeshBuilder.CreatePlane("card1",{width:.66,height:-1.0,sideOrientation:BABYLON.Mesh.DOUBLESIDE},scene);card1.position.y=.5;const card2=card1.clone("card2");card2.rotation.y=Math.PI/2;const grass=BABYLON.Mesh.MergeMeshes([card1,card2],true,true,undefined,false,true);grass.isPickable=false;grass.alwaysSelectAsActiveMesh=true;
const grassTexture=new BABYLON.Texture(TEXTURE_URL,scene,true,false,BABYLON.Texture.TRILINEAR_SAMPLINGMODE,()=>statusEl.textContent="Grass texture loaded.",(message,error)=>statusEl.textContent="Texture failed: "+(message||error?.message||"unknown error"));grassTexture.hasAlpha=true;grassTexture.wrapU=BABYLON.Texture.CLAMP_ADDRESSMODE;grassTexture.wrapV=BABYLON.Texture.CLAMP_ADDRESSMODE;grassTexture.anisotropicFilteringLevel=8;
let windWorking=!!BABYLON.CustomMaterial,grassMat;
if(windWorking){grassMat=new BABYLON.CustomMaterial("grassMat",scene);grassMat.diffuseTexture=grassTexture;grassMat.useAlphaFromDiffuseTexture=true;grassMat.transparencyMode=BABYLON.Material.MATERIAL_ALPHATEST;grassMat.alphaCutOff=.12;grassMat.backFaceCulling=false;grassMat.specularColor=BABYLON.Color3.Black();grassMat.emissiveColor=new BABYLON.Color3(.015,.025,.004);grassMat.AddUniform("uTime","float",0);grassMat.AddUniform("uWindStrength","float",.45);grassMat.AddAttribute("instanceSeed");grassMat.Vertex_Definitions(`attribute float instanceSeed;`);grassMat.Vertex_Before_PositionUpdated(`float grassHeight=clamp(abs(positionUpdated.y),0.0,1.0);grassHeight*=grassHeight;float phase=uTime*1.25+instanceSeed*6.2831853;float broadSway=sin(phase);float fineSway=sin(phase*1.71+instanceSeed*9.7);float sway=broadSway*.72+fineSway*.28;positionUpdated.x+=sway*.075*uWindStrength*grassHeight;positionUpdated.z+=fineSway*.020*uWindStrength*grassHeight;`);}else{grassMat=new BABYLON.StandardMaterial("grassMatFallback",scene);grassMat.diffuseTexture=grassTexture;grassMat.useAlphaFromDiffuseTexture=true;grassMat.transparencyMode=BABYLON.Material.MATERIAL_ALPHATEST;grassMat.alphaCutOff=.12;grassMat.backFaceCulling=false;grassMat.specularColor=BABYLON.Color3.Black();}
grass.material=grassMat;
let seed=1944;function rand(){seed=(seed*1664525+1013904223)>>>0;return seed/4294967296}
const matrices=new Float32Array(MAX_GRASS*16),instanceSeeds=new Float32Array(MAX_GRASS),matrix=new BABYLON.Matrix(),scaling=new BABYLON.Vector3(),rotation=new BABYLON.Quaternion(),position=new BABYLON.Vector3();let built=0,buffersReady=false;
function buildChunk(){const CHUNK_SIZE=15000,end=Math.min(built+CHUNK_SIZE,MAX_GRASS);for(let i=built;i<end;i++){const x=(rand()-.5)*480,z=(rand()-.5)*480,size=.72+rand()*.46,heightVariation=.82+rand()*.30;scaling.set(size,size*heightVariation,size);BABYLON.Quaternion.RotationYawPitchRollToRef(rand()*Math.PI*2,0,0,rotation);position.set(x,0,z);BABYLON.Matrix.ComposeToRef(scaling,rotation,position,matrix);matrix.copyToArray(matrices,i*16);instanceSeeds[i]=rand()}built=end;const percent=Math.round(built/MAX_GRASS*100);barFill.style.width=percent+"%";statusEl.textContent="Planting "+built.toLocaleString()+" / "+MAX_GRASS.toLocaleString();if(built<MAX_GRASS){setTimeout(buildChunk,0);return}grass.thinInstanceSetBuffer("matrix",matrices,16,true);if(windWorking)grass.thinInstanceSetBuffer("instanceSeed",instanceSeeds,1,true);buffersReady=true;grass.thinInstanceCount=START_GRASS;statusEl.textContent="Ready — showing "+START_GRASS.toLocaleString()+" of "+MAX_GRASS.toLocaleString()}
buildChunk();
densityEl.addEventListener("input",()=>{const amount=Math.max(5000,Math.min(MAX_GRASS,Number(densityEl.value)||START_GRASS));densityLabelEl.textContent=amount.toLocaleString();if(buffersReady)grass.thinInstanceCount=amount;statusEl.textContent="Showing "+amount.toLocaleString()+" grass clumps"});
const movement={forward:false,back:false,left:false,right:false};document.querySelectorAll("[data-move]").forEach(button=>{const d=button.dataset.move;const start=e=>{e.preventDefault();movement[d]=true;canvas.focus()},stop=e=>{e.preventDefault();movement[d]=false};button.addEventListener("pointerdown",start);button.addEventListener("pointerup",stop);button.addEventListener("pointercancel",stop);button.addEventListener("pointerleave",stop)});
resetBtn.addEventListener("click",()=>{camera.position.set(0,1.9,-8);camera.rotation.set(0,0,0);canvas.focus()});fullscreenBtn.addEventListener("click",async()=>{if(!document.fullscreenElement)await document.documentElement.requestFullscreen();else await document.exitFullscreen()});
let time=0;scene.onBeforeRenderObservable.add(()=>{const dt=Math.min(engine.getDeltaTime()/1000,.05);time+=dt;camera.position.y=1.9;if(windWorking){const effect=grassMat.getEffect();if(effect){effect.setFloat("uTime",time);effect.setFloat("uWindStrength",Number(windEl.value)||0)}}const forward=camera.getDirection(BABYLON.Axis.Z);forward.y=0;forward.normalize();const right=camera.getDirection(BABYLON.Axis.X);right.y=0;right.normalize();const movementSpeed=dt*4.3;if(movement.forward)camera.position.addInPlace(forward.scale(movementSpeed));if(movement.back)camera.position.subtractInPlace(forward.scale(movementSpeed));if(movement.right)camera.position.addInPlace(right.scale(movementSpeed));if(movement.left)camera.position.subtractInPlace(right.scale(movementSpeed));camera.position.x=Math.max(-235,Math.min(235,camera.position.x));camera.position.z=Math.max(-235,Math.min(235,camera.position.z))});
setTimeout(()=>{if(!windWorking)return;const effect=grassMat.getEffect();if(effect&&effect.isReady&&effect.isReady())return;const fallback=new BABYLON.StandardMaterial("grassFallback",scene);fallback.diffuseTexture=grassTexture;fallback.useAlphaFromDiffuseTexture=true;fallback.transparencyMode=BABYLON.Material.MATERIAL_ALPHATEST;fallback.alphaCutOff=.12;fallback.backFaceCulling=false;fallback.specularColor=BABYLON.Color3.Black();fallback.emissiveColor=new BABYLON.Color3(.015,.025,.004);grass.material=fallback;windWorking=false;statusEl.textContent="Wind shader fallback — static grass active."},4000);
let frame=0;engine.runRenderLoop(()=>{scene.render();frame++;if(frame%15===0)fpsEl.textContent="FPS: "+Math.round(engine.getFps())});window.addEventListener("resize",()=>engine.resize());
</script>
</body>
</html>

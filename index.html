1000).toFixed(2)+'s] '+msg;con.appendChild(d);con.scrollTop=con.scrollHeight;try{console.log(msg)}catch(_){}}function prog(n,s){fill.style.width=n+'%';pct.textContent=n+'%';stage.textContent=s;log(s+' ('+n+'%)','dim')}async function grab(url,ms,label){const host=new URL(url).host;log(label+': requesting '+host);const c=new AbortController(),start=performance.now(),t=setTimeout(()=>c.abort(),ms);try{const r=await fetch(url,{cache:'no-store',signal:c.signal});log(label+': HTTP '+r.status+' from '+host,r.ok?'ok':'err');if(!r.ok)throw new Error('HTTP '+r.status);const text=await r.text();log(label+': received '+text.length.toLocaleString()+' bytes in '+Math.round(performance.now()-start)+' ms','ok');return text}catch(e){log(label+': '+(e&&e.name==='AbortError'?'TIMEOUT after '+ms+' ms':(e.message||String(e))),'err');throw e}finally{clearTimeout(t)}}async function fallback(urls,label){let err;for(let i=0;i<urls.length;i++){try{if(i)log(label+': switching to fallback','dim');return await grab(urls[i],8000,label)}catch(e){err=e}}throw err||new Error(label+' failed')}try{log('v21 loader initialized','ok');log('User agent: '+navigator.userAgent,'dim');prog(10,'Connecting to CDN');const coreUrls=['https://cdn.jsdelivr.net/gh/Teethree89/grasstex@bcd3d757ccd4979a02561601908073f42d844a04/index.html','https://raw.githubusercontent.com/Teethree89/grasstex/bcd3d757ccd4979a02561601908073f42d844a04/index.html?ts='+Date.now()];const camUrls=['https://cdn.jsdelivr.net/gh/Teethree89/grasstex@8f956fbdd0c73f6b1535f4124353d680fc83ee26/bodycam.js','https://raw.githubusercontent.com/Teethree89/grasstex/8f956fbdd0c73f6b1535f4124353d680fc83ee26/bodycam.js?ts='+Date.now()];prog(24,'Downloading world build');let html=await fallback(coreUrls,'World build');prog(66,'Downloading bodycam camera');const cam=await fallback(camUrls,'Bodycam camera');prog(86,'Preparing scene');html=html.replace('<strong>Version:</strong> v15','<strong>Version:</strong> v21').replace('<strong>Build:</strong> deterministic-world-chunks','<strong>Build:</strong> deterministic-world-chunks + bodycam-camera-v21');const closeBody='</bo'+'dy></ht'+'ml>';const openScript='<scr'+'ipt>';const closeScript='</scr'+'ipt>';html=html.replace(closeBody,openScript+cam+closeScript+closeBody);log('Scene HTML assembled: '+html.length.toLocaleString()+' bytes','ok');prog(100,'Starting renderer');log('Handing off to renderer','ok');setTimeout(()=>{document.open();document.write(html);document.close()},250)}catch(e){fill.style.width='100%';fill.style.background='#c96a6a';loadText.textContent='v21 load failed';stage.textContent=(e&&e.name==='AbortError')?'Network request timed out':(e.message||String(e));pct.textContent='';log('FATAL: '+stage.textContent,'err')}})();</script></body></html>

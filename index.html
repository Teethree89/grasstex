<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Babylon Grass Demo</title><style>html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#0f141c;font-family:Arial,sans-serif}#renderCanvas{width:100%;height:100%;display:block;touch-action:none}#ui{position:absolute;top:12px;left:12px;z-index:10;color:#fff;background:rgba(10,15,12,.74);border:1px solid rgba(255,255,255,.16);border-radius:14px;padding:14px;min-width:280px;max-width:min(88vw,360px);backdrop-filter:blur(8px)}#ui h3{margin:0 0 10px;font-size:20px}#ui .row{margin:10px 0;font-size:14px}#ui label{display:block;margin-bottom:4px;font-weight:600}#ui input[type=range]{width:100%}#ui button{padding:8px 12px;border-radius:10px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.12);color:#fff;cursor:pointer}.draws{display:flex;gap:12px;flex-wrap:wrap}.draws label{display:flex!important;align-items:center;gap:5px;margin:0!important}.draws input{width:18px;height:18px;margin:0}#status{font-size:13px;color:#dce6da}#barTrack{height:10px;background:rgba(255,255,255,.16);border-radius:999px;overflow:hidden;margin-top:8px}#barFill{height:100%;width:0;background:#7dc957}#fps,#fullscreenBtn{position:absolute;right:12px;z-index:10;color:#fff;background:rgba(10,15,12,.74);border:1px solid rgba(255,255,255,.16);border-radius:10px;padding:8px 10px}#fps{top:12px}#fullscreenBtn{top:58px;padding:10px 12px}#help{position:absolute;left:12px;bottom:12px;z-index:10;color:#fff;background:rgba(10,15,12,.74);border:1px solid rgba(255,255,255,.16);border-radius:10px;padding:10px 12px;font-size:13px;line-height:1.4}#pad{position:absolute;right:12px;bottom:12px;z-index:10;display:grid;grid-template-columns:56px 56px 56px;grid-template-rows:56px 56px;gap:6px;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}#pad button{border:1px solid rgba(255,255,255,.22);border-radius:12px;background:rgba(10,15,12,.74);color:#fff;font-size:22px;font-weight:bold;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;outline:none}#pad .up{grid-column:2}.left{grid-column:1;grid-row:2}.down{grid-column:2;grid-row:2}.right{grid-column:3;grid-row:2}</style></head><body><canvas id="renderCanvas"></canvas><div id="ui"><h3>Grass Field Demo</h3><div class="row"><strong>Version:</strong> v10</div><div class="row"><strong>Ground:</strong> dirt + near feather patches</div><div class="row"><strong>Grass:</strong> 6 variants</div><div class="row"><strong>Draw layers</strong><div class="draws"><label><input id="drawNear" type="checkbox" checked>Near</label><label><input id="drawMedium" type="checkbox" checked>Medium</label><label><input id="drawFar" type="checkbox" checked>Far</label></div></div><div class="row"><label>Density (<span id="densityLabel">50,000</span>)</label><input id="density" type="range" min="5000" max="450000" step="5000" value="50000"></div><div class="row"><label>Wind Strength</label><input id="wind" type="range" min="0" max="1.5" step="0.05" value="0.45"></div><div class="row"><button id="resetBtn">Reset View</button></div><div id="status">Loading…</div><div id="barTrack"><div id="barFill"></div></div></div><div id="fps">FPS: --</div><button id="fullscreenBtn">Fullscreen</button><div id="help"><b>Desktop:</b> WASD + drag mouse<br><b>Phone:</b> drag to look + arrows</div><div id="pad"><button class="up" data-move="forward">▲</button><button class="left" data-move="left">◀</button><button class="down" data-move="back">▼</button><button class="right" data-move="right">▶</button></div><script src="https://cdn.jsdelivr.net/npm/babylonjs@8.26.0/babylon.js"></script><script src="https://cdn.jsdelivr.net/npm/babylonjs-materials@8.26.0/babylonjs.materials.min.js"></script><script>
if(location.protocol==='http:')location.replace('https://'+location.host+location.pathname+location.search+location.hash);
const A='https://test.ivandpopov.com/grasstex/Assets/';
const V=[{file:'grasstex0.png',ground:.991,width:.66,height:1},{file:'grasstex1.png',ground:.956,width:.72,height:1.04},{file:'grasstex2.png',ground:.961,width:.70,height:1.10},{file:'grasstex3.png',ground:.979,width:.76,height:.98},{file:'grasstex4.png',ground:.967,width:.74,height:1.06},{file:'grasstex5.png',ground:.970,width:.71,height:1.02}];
const MAX=450000,START=50000,MED=24000,FAR=18000,FIELD=480;
const $=id=>document.getElementById(id),canvas=$('renderCanvas'),density=$('density'),densityLabel=$('densityLabel'),wind=$('wind'),resetBtn=$('resetBtn'),fullscreenBtn=$('fullscreenBtn'),fps=$('fps'),status=$('status'),bar=$('barFill'),drawNear=$('drawNear'),drawMedium=$('drawMedium'),drawFar=$('drawFar');
const engine=new BABYLON.Engine(canvas,true,{antialias:true,preserveDrawingBuffer:false,stencil:false}),scene=new BABYLON.Scene(engine);scene.clearColor=new BABYLON.Color4(.54,.72,.85,1);scene.fogMode=BABYLON.Scene.FOGMODE_EXP2;scene.fogDensity=.0038;scene.fogColor=new BABYLON.Color3(.54,.72,.85);
const camera=new BABYLON.FreeCamera('camera',new BABYLON.Vector3(0,1.9,-8),scene);camera.minZ=.05;camera.maxZ=600;camera.speed=.4;camera.angularSensibility=4000;camera.keysUp=[87];camera.keysDown=[83];camera.keysLeft=[65];camera.keysRight=[68];camera.attachControl(canvas,true);
const hemi=new BABYLON.HemisphericLight('hemi',new BABYLON.Vector3(.15,1,.2),scene);hemi.intensity=.9;hemi.groundColor=new BABYLON.Color3(.12,.16,.06);const sun=new BABYLON.DirectionalLight('sun',new BABYLON.Vector3(-.5,-1,.25),scene);sun.intensity=.7;
const ground=BABYLON.MeshBuilder.CreateGround('ground',{width:500,height:500},scene),gm=new BABYLON.StandardMaterial('groundMat',scene);gm.diffuseColor=new BABYLON.Color3(.29,.235,.145);gm.specularColor=BABYLON.Color3.Black();ground.material=gm;
// Near filltex feather: 0.65m, exactly 25% of the original 2.6m patch.
const nearPatch=BABYLON.MeshBuilder.CreatePlane('nearPatch',{width:.65,height:.65,sideOrientation:BABYLON.Mesh.DOUBLESIDE},scene);nearPatch.rotation.x=Math.PI/2;nearPatch.position.y=.01;nearPatch.bakeCurrentTransformIntoVertices();nearPatch.rotation.set(0,0,0);nearPatch.position.set(0,0,0);nearPatch.isPickable=false;nearPatch.alwaysSelectAsActiveMesh=true;
const fillTex=new BABYLON.Texture(A+'filltex.png',scene,true,false,BABYLON.Texture.TRILINEAR_SAMPLINGMODE);fillTex.wrapU=fillTex.wrapV=BABYLON.Texture.CLAMP_ADDRESSMODE;fillTex.anisotropicFilteringLevel=8;
BABYLON.Effect.ShadersStore.patchVertexShader=`precision highp float;attribute vec3 position;attribute vec2 uv;attribute vec4 world0;attribute vec4 world1;attribute vec4 world2;attribute vec4 world3;uniform mat4 viewProjection;varying vec2 vUV;void main(){gl_Position=viewProjection*mat4(world0,world1,world2,world3)*vec4(position,1.);vUV=uv;}`;
BABYLON.Effect.ShadersStore.patchFragmentShader=`precision highp float;varying vec2 vUV;uniform sampler2D fillTexture;void main(){vec2 p=vUV-.5;float r=length(p)*2.;float fade=1.-smoothstep(.42,1.,r);vec4 c=texture2D(fillTexture,vUV);float a=fade*.82;if(a<.025)discard;gl_FragColor=vec4(c.rgb,a);}`;
const patchMat=new BABYLON.ShaderMaterial('patchMat',scene,{vertex:'patch',fragment:'patch'},{attributes:['position','uv','world0','world1','world2','world3'],uniforms:['viewProjection'],samplers:['fillTexture'],needAlphaBlending:true});patchMat.backFaceCulling=false;patchMat.setTexture('fillTexture',fillTex);nearPatch.material=patchMat;
// Shared Y billboard shader for medium/far.
BABYLON.Effect.ShadersStore.lodVertexShader=`precision highp float;attribute vec3 position;attribute vec2 uv;attribute vec4 world0;attribute vec4 world1;attribute vec4 world2;attribute vec4 world3;uniform mat4 viewProjection;uniform vec3 cameraPosition;varying vec2 vUV;varying float vD;void main(){vec3 c=world3.xyz;float sx=length(world0.xyz),sy=length(world1.xyz);vec3 t=cameraPosition-c;vD=length(t);t.y=0.;vec3 f=t/max(length(t),.0001);vec3 r=normalize(vec3(f.z,0.,-f.x));vec3 p=c+r*(position.x*sx)+vec3(0.,1.,0.)*(position.y*sy);gl_Position=viewProjection*vec4(p,1.);vUV=uv;}`;
BABYLON.Effect.ShadersStore.medFragmentShader=`precision highp float;varying vec2 vUV;varying float vD;uniform sampler2D grassTexture;void main(){vec4 c=texture2D(grassTexture,vUV);float a=c.a*smoothstep(28.,45.,vD)*(1.-smoothstep(138.,165.,vD));if(a<.10)discard;gl_FragColor=vec4(c.rgb,1.);}`;
BABYLON.Effect.ShadersStore.farFragmentShader=`precision highp float;varying vec2 vUV;varying float vD;uniform sampler2D grassTexture;void main(){vec4 c=texture2D(grassTexture,vUV);float a=c.a*smoothstep(150.,178.,vD)*(1.-smoothstep(242.,258.,vD));if(a<.10)discard;gl_FragColor=vec4(c.rgb,1.);}`;
function makeBillboard(def,i,kind){const p=BABYLON.MeshBuilder.CreatePlane(kind+i,{width:def.width,height:-def.height,sideOrientation:BABYLON.Mesh.DOUBLESIDE},scene);p.position.y=def.height*(def.ground-.5);p.bakeCurrentTransformIntoVertices();p.position.set(0,0,0);p.isPickable=false;p.alwaysSelectAsActiveMesh=true;const tx=new BABYLON.Texture(A+def.file,scene,true,false,BABYLON.Texture.TRILINEAR_SAMPLINGMODE);tx.hasAlpha=true;tx.wrapU=tx.wrapV=BABYLON.Texture.CLAMP_ADDRESSMODE;tx.anisotropicFilteringLevel=8;const m=new BABYLON.ShaderMaterial(kind+'Mat'+i,scene,{vertex:'lod',fragment:kind==='med'?'med':'far'},{attributes:['position','uv','world0','world1','world2','world3'],uniforms:['viewProjection','cameraPosition'],samplers:['grassTexture'],needAlphaBlending:false});m.backFaceCulling=false;m.setTexture('grassTexture',tx);p.material=m;return{mesh:p,mat:m}}
const medTypes=V.map((d,i)=>makeBillboard(d,i,'med')),farTypes=V.map((d,i)=>makeBillboard(d,i,'far'));
function rng(seed){return()=>{seed=(seed*1664525+1013904223)>>>0;return seed/4294967296}}
const mr=rng(991),fr=rng(7331),mm=new BABYLON.Matrix(),ms=new BABYLON.Vector3(),mq=new BABYLON.Quaternion(),mp=new BABYLON.Vector3();
function uploadScatter(types,count,rand,far=false){const raw=Array.from({length:6},()=>[]);for(let i=0;i<count;i++){let x,z,sx,sy;if(far){const row=i%3,a=(i/count)*Math.PI*6+row*.016,r=165+row*.72+(rand()-.5)*.22;x=Math.cos(a)*r;z=Math.sin(a)*r;sx=.82+rand()*.18;sy=.82+rand()*.14}else{x=(rand()-.5)*FIELD;z=(rand()-.5)*FIELD;sx=.82+rand()*.36;sy=sx}ms.set(sx,sy,sx);BABYLON.Quaternion.RotationYawPitchRollToRef(0,0,0,mq);mp.set(x,0,z);BABYLON.Matrix.ComposeToRef(ms,mq,mp,mm);const a=raw[i%6];for(let k=0;k<16;k++)a.push(mm.m[k])}raw.forEach((a,i)=>types[i].mesh.thinInstanceSetBuffer('matrix',new Float32Array(a),16,true))}
uploadScatter(medTypes,MED,mr,false);uploadScatter(farTypes,FAR,fr,true);
// Near crossed-card detail.
const CAP=Math.ceil(MAX/6)+64,nearTypes=[];
function makeNear(def,i){const y=def.height*(def.ground-.5),a=BABYLON.MeshBuilder.CreatePlane('na'+i,{width:def.width,height:-def.height,sideOrientation:BABYLON.Mesh.DOUBLESIDE},scene);a.position.y=y;const b=a.clone('nb'+i);b.rotation.y=Math.PI/2;const mesh=BABYLON.Mesh.MergeMeshes([a,b],true,true,undefined,false,true);mesh.isPickable=false;mesh.alwaysSelectAsActiveMesh=true;const tx=new BABYLON.Texture(A+def.file,scene,true,false,BABYLON.Texture.TRILINEAR_SAMPLINGMODE);tx.hasAlpha=true;tx.wrapU=tx.wrapV=BABYLON.Texture.CLAMP_ADDRESSMODE;tx.anisotropicFilteringLevel=8;let mat;if(BABYLON.CustomMaterial){mat=new BABYLON.CustomMaterial('nearMat'+i,scene);mat.diffuseTexture=tx;mat.useAlphaFromDiffuseTexture=true;mat.transparencyMode=BABYLON.Material.MATERIAL_ALPHATEST;mat.alphaCutOff=.12;mat.backFaceCulling=false;mat.specularColor=BABYLON.Color3.Black();mat.AddUniform('uTime','float',0);mat.AddUniform('uWindStrength','float',.45);mat.AddAttribute('instanceSeed');mat.Vertex_Definitions('attribute float instanceSeed;');mat.Vertex_Before_PositionUpdated(`float h=clamp(abs(positionUpdated.y)/${def.height.toFixed(3)},0.,1.);h*=h;float ph=uTime*1.2+instanceSeed*6.283+${(i*.73).toFixed(2)};float f=sin(ph*1.71+instanceSeed*9.7);positionUpdated.x+=(sin(ph)*.72+f*.28)*.07*uWindStrength*h;positionUpdated.z+=f*.018*uWindStrength*h;`)}else{mat=new BABYLON.StandardMaterial('nearMat'+i,scene);mat.diffuseTexture=tx;mat.useAlphaFromDiffuseTexture=true;mat.transparencyMode=BABYLON.Material.MATERIAL_ALPHATEST;mat.alphaCutOff=.12;mat.backFaceCulling=false}mesh.material=mat;return{mesh,mat,m:new Float32Array(CAP*16),s:new Float32Array(CAP),count:0}}
V.forEach((d,i)=>nearTypes.push(makeNear(d,i)));
const patchMatrices=new Float32Array(MAX*16),M=new BABYLON.Matrix(),S=new BABYLON.Vector3(),Q=new BABYLON.Quaternion(),P=new BABYLON.Vector3();let built=0,ready=false,seed=1944;function rand(){seed=(seed*1664525+1013904223)>>>0;return seed/4294967296}
function build(){const end=Math.min(built+15000,MAX);for(let i=built;i<end;i++){const ti=Math.min(5,Math.floor(rand()*6)),t=nearTypes[ti],slot=t.count++,x=(rand()-.5)*FIELD,z=(rand()-.5)*FIELD,sz=.70+rand()*.48,hv=.82+rand()*.30;S.set(sz,sz*hv,sz);BABYLON.Quaternion.RotationYawPitchRollToRef(rand()*Math.PI*2,0,0,Q);P.set(x,0,z);BABYLON.Matrix.ComposeToRef(S,Q,P,M);M.copyToArray(t.m,slot*16);t.s[slot]=rand();const ps=.85+rand()*.30;S.set(ps,ps,ps);BABYLON.Quaternion.RotationYawPitchRollToRef(rand()*Math.PI*2,0,0,Q);P.set(x,.01,z);BABYLON.Matrix.ComposeToRef(S,Q,P,M);M.copyToArray(patchMatrices,i*16)}built=end;bar.style.width=Math.round(built/MAX*100)+'%';status.textContent='Planting '+built.toLocaleString()+' / '+MAX.toLocaleString();if(built<MAX){setTimeout(build,0);return}nearTypes.forEach(t=>{t.mesh.thinInstanceSetBuffer('matrix',t.m.subarray(0,t.count*16),16,true);if(BABYLON.CustomMaterial)t.mesh.thinInstanceSetBuffer('instanceSeed',t.s.subarray(0,t.count),1,true)});nearPatch.thinInstanceSetBuffer('matrix',patchMatrices,16,true);ready=true;setDensity(START);applyDraw();status.textContent='Ready — near clumps + feather patches + full-size medium billboards'}build();
function setDensity(n){if(!ready)return;let shown=0;nearTypes.forEach((t,i)=>{const target=i===5?Math.max(0,n-shown):Math.floor(n*(t.count/MAX)),c=Math.min(t.count,target);t.mesh.thinInstanceCount=c;shown+=c});nearPatch.thinInstanceCount=n}
function applyDraw(){const n=drawNear.checked,m=drawMedium.checked,f=drawFar.checked;nearTypes.forEach(t=>t.mesh.setEnabled(n));nearPatch.setEnabled(n);medTypes.forEach(t=>t.mesh.setEnabled(m));farTypes.forEach(t=>t.mesh.setEnabled(f));status.textContent=`Draws — Near ${n?'ON':'OFF'} / Medium ${m?'ON':'OFF'} / Far ${f?'ON':'OFF'}`}
[drawNear,drawMedium,drawFar].forEach(x=>x.addEventListener('change',applyDraw));density.addEventListener('input',()=>{const n=+density.value;densityLabel.textContent=n.toLocaleString();setDensity(n)});
const movement={forward:false,back:false,left:false,right:false};document.querySelectorAll('[data-move]').forEach(b=>{const d=b.dataset.move;const on=e=>{e.preventDefault();movement[d]=true},off=e=>{e.preventDefault();movement[d]=false};b.addEventListener('pointerdown',on,{passive:false});['pointerup','pointercancel','pointerleave'].forEach(x=>b.addEventListener(x,off,{passive:false}));b.addEventListener('contextmenu',e=>e.preventDefault())});resetBtn.onclick=()=>{camera.position.set(0,1.9,-8);camera.rotation.set(0,0,0)};fullscreenBtn.onclick=async()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();
let time=0,frame=0;scene.onBeforeRenderObservable.add(()=>{const dt=Math.min(engine.getDeltaTime()/1000,.05);time+=dt;camera.position.y=1.9;medTypes.forEach(t=>t.mat.setVector3('cameraPosition',camera.globalPosition));farTypes.forEach(t=>t.mat.setVector3('cameraPosition',camera.globalPosition));if(BABYLON.CustomMaterial){const w=+wind.value;nearTypes.forEach(t=>{const e=t.mat.getEffect();if(e){e.setFloat('uTime',time);e.setFloat('uWindStrength',w)}})}const f=camera.getDirection(BABYLON.Axis.Z);f.y=0;f.normalize();const r=camera.getDirection(BABYLON.Axis.X);r.y=0;r.normalize();const sp=dt*4.3;if(movement.forward)camera.position.addInPlace(f.scale(sp));if(movement.back)camera.position.subtractInPlace(f.scale(sp));if(movement.right)camera.position.addInPlace(r.scale(sp));if(movement.left)camera.position.subtractInPlace(r.scale(sp));camera.position.x=Math.max(-235,Math.min(235,camera.position.x));camera.position.z=Math.max(-235,Math.min(235,camera.position.z))});engine.runRenderLoop(()=>{scene.render();if(++frame%15===0)fps.textContent='FPS: '+Math.round(engine.getFps())});addEventListener('resize',()=>engine.resize());
</script></body></html>

<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Grass Loader v25</title><style>html,body{margin:0;width:100%;height:100%;background:#0f141c;color:#fff;font-family:Arial,sans-serif}#load{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;box-sizing:border-box}.loader{width:min(500px,90vw);text-align:center}.title{font-size:24px;margin-bottom:18px}.track{height:10px;border-radius:999px;background:rgba(255,255,255,.14);overflow:hidden;border:1px solid rgba(255,255,255,.12)}#fill{height:100%;width:8%;background:#fff;border-radius:999px;transition:width .2s ease}.meta{margin-top:10px;font-size:13px;color:rgba(255,255,255,.68)}#build{margin-top:16px;letter-spacing:.16em;color:rgba(255,255,255,.45)}#console{margin-top:16px;padding:12px 14px;min-height:180px;max-height:340px;overflow:auto;text-align:left;background:#05080c;border:1px solid rgba(255,255,255,.16);border-radius:8px;font:11px/1.5 ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;color:#b9c7d8;white-space:pre-wrap;word-break:break-word}button{margin-top:14px;padding:9px 14px;border-radius:8px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.1);color:#fff;font-size:14px}</style></head><body><div id="load"><div class="loader"><div class="title" id="loadText">Loading latest grass build…</div><div class="track"><div id="fill"></div></div><div class="meta"><span id="stage">Starting</span> · <span id="pct">8%</span></div><div id="build">PERMANENT LOADER V25</div><div id="console" aria-live="polite"><div>[0.00s] Loader HTML ready.</div></div><button id="retry" type="button" hidden>Retry</button></div></div><script>(function(){var fill=document.getElementById('fill'),pct=document.getElementById('pct'),stage=document.getElementById('stage'),text=document.getElementById('loadText'),con=document.getElementById('console'),retry=document.getElementById('retry'),t0=performance.now();function log(s){var d=document.createElement('div');d.textContent='['+((performance.now()-t0)/1000).toFixed(2)+'s] '+s;con.appendChild(d);con.scrollTop=con.scrollHeight}function prog(n,s){fill.style.width=n+'%';pct.textContent=n+'%';stage.textContent=s;log(s)}async function load(){retry.hidden=true;fill.style.background='#fff';prog(15,'Requesting current main/game.html');var controller=new AbortController(),timer=setTimeout(function(){controller.abort()},10000);try{var url='https://raw.githubusercontent.com/Teethree89/grasstex/main/game.html?ts='+Date.now();log('GET '+url);var r=await fetch(url,{cache:'no-store',signal:controller.signal});clearTimeout(timer);log('HTTP '+r.status);if(!r.ok)throw new Error('HTTP '+r.status);prog(65,'Downloading current game build');var html=await r.text();log('Received '+html.length.toLocaleString()+' bytes');if(html.toLowerCase().indexOf('<html')<0)throw new Error('Response was not HTML');prog(92,'Launching current game build');setTimeout(function(){prog(100,'Starting renderer');document.open();document.write(html);document.close()},120)}catch(e){clearTimeout(timer);fill.style.width='100%';fill.style.background='#c96a6a';text.textContent='Could not load current game build';stage.textContent=e&&e.name==='AbortError'?'Request timed out':(e.message||String(e));pct.textContent='';log('ERROR: '+stage.textContent);retry.hidden=false}}retry.addEventListener('click',load);load()})();</script></body></html>

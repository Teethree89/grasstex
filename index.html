<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Babylon Grass Demo</title><style>html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#0f141c;font-family:Arial,sans-serif}#renderCanvas{width:100%;height:100%;display:block;touch-action:none}#ui{position:absolute;top:12px;left:12px;z-index:10;color:#fff;background:rgba(10,15,12,.74);border:1px solid rgba(255,255,255,.16);border-radius:14px;padding:14px;min-width:280px;max-width:min(88vw,360px);backdrop-filter:blur(8px)}#ui h3{margin:0 0 10px;font-size:20px}#ui .row{margin:10px 0;font-size:14px}#ui label{display:block;margin-bottom:4px;font-weight:600}#ui input[type=range]{width:100%}#ui button{padding:8px 12px;border-radius:10px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.12);color:#fff}.draws{display:flex;gap:12px;flex-wrap:wrap}.draws label{display:flex!important;align-items:center;gap:5px;margin:0!important}.draws input{width:18px;height:18px;margin:0}#status{font-size:13px;color:#dce6da}#fps,#fullscreenBtn{position:absolute;right:12px;z-index:10;color:#fff;background:rgba(10,15,12,.74);border:1px solid rgba(255,255,255,.16);border-radius:10px;padding:8px 10px}#fps{top:12px}#fullscreenBtn{top:58px;padding:10px 12px}#help{position:absolute;left:12px;bottom:12px;z-index:10;color:#fff;background:rgba(10,15,12,.74);border:1px solid rgba(255,255,255,.16);border-radius:10px;padding:10px 12px;font-size:13px;line-height:1.4}#pad{position:absolute;right:12px;bottom:12px;z-index:10;display:grid;grid-template-columns:56px 56px 56px;grid-template-rows:56px 56px;gap:6px;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}#pad button{border:1px solid rgba(255,255,255,.22);border-radius:12px;background:rgba(10,15,12,.74);color:#fff;font-size:22px;font-weight:bold;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;outline:none}#pad .up{grid-column:2}.left{grid-column:1;grid-row:2}.down{grid-column:2;grid-row:2}.right{grid-column:3;grid-row:2}</style></head><body><canvas id="renderCanvas"></canvas><div id="ui"><h3>Grass Field Demo</h3><div class="row"><strong>Version:</strong> v15</div><div class="row"><strong>Build:</strong> deterministic-world-chunks</div><div class="row"><strong>World:</strong> 32 m deterministic chunks</div><div class="row"><strong>LOD:</strong> same clumps Near ⇄ Medium ⇄ Far</div><div class="row"><strong>Grass:</strong> 6 variants</div><div class="row"><strong>Draw layers</strong><div class="draws"><label><input id="drawNear" type="checkbox" checked>Near</label><label><input id="drawMedium" type="checkbox" checked>Medium</label><label><input id="drawFar" type="checkbox" checked>Far</label></div></div><div class="row"><label>Density (<span id="densityLabel">50,000</span>)</label><input id="density" type="range" min="5000" max="450000" step="5000" value="50000"></div><div class="row"><label>Wind Strength</label><input id="wind" type="range" min="0" max="1.5" step="0.05" value="0.45"></div><div class="row"><button id="resetBtn">Reset View</button></div><div id="status">Building world chunks…</div></div><div id="fps">FPS: --</div><button id="fullscreenBtn">Fullscreen</button><div id="help"><b>Desktop:</b> WASD + drag mouse<br><b>Phone:</b> drag to look + arrows</div><div id="pad"><button class="up" data-move="forward">▲</button><button class="left" data-move="left">◀</button><button class="down" data-move="back">▼</button><button class="right" data-move="right">▶</button></div><script src="https://cdn.jsdelivr.net/npm/babylonjs@8.26.0/babylon.js"></script><script>
if(location.protocol==='http:')location.replace('https://'+location.host+location.pathname+location.search+location.hash);
const A='https://test.ivandpopov.com/grasstex/Assets/';
const V=[{file:'grasstex0.png',ground:.991,width:.66,height:1},{file:'grasstex1.png',ground:.956,width:.72,height:1.04},{file:'grasstex2.png',ground:.961,width:.70,height:1.10},{file:'grasstex3.png',ground:.979,width:.76,height:.98},{file:'grasstex4.png',ground:.967,width:.74,height:1.06},{file:'grasstex5.png',ground:.970,width:.71,height:1.02}];
const CHUNK=32,NEAR_END=45,MED_END=165,FAR_START=150,FAR_END=242,REFERENCE_FIELD=480;
const $=id=>document.getElementById(id),canvas=$('renderCanvas'),density=$('density'),densityLabel=$('densityLabel'),wind=$('wind'),resetBtn=$('resetBtn'),fullscreenBtn=$('fullscreenBtn'),fps=$('fps'),status=$('status'),drawNear=$('drawNear'),drawMedium=$('drawMedium'),drawFar=$('drawFar');
const engine=new BABYLON.Engine(canvas,true,{antialias:true,preserveDrawingBuffer:false,stencil:false}),scene=new BABYLON.Scene(engine);scene.clearColor=new BABYLON.Color4(.54,.72,.85,1);scene.fogMode=BABYLON.Scene.FOGMODE_EXP2;scene.fogDensity=.0038;scene.fogColor=new BABYLON.Color3(.54,.72,.85);
const camera=new BABYLON.FreeCamera('camera',new BABYLON.Vector3(0,1.9,-8),scene);camera.minZ=.05;camera.maxZ=700;camera.angularSensibility=4000;camera.keysUp=[87];camera.keysDown=[83];camera.keysLeft=[65];camera.keysRight=[68];camera.attachControl(canvas,true);
const hemi=new BABYLON.HemisphericLight('hemi',new BABYLON.Vector3(.15,1,.2),scene);hemi.intensity=.9;const sun=new BABYLON.DirectionalLight('sun',new BABYLON.Vector3(-.5,-1,.25),scene);sun.intensity=.7;
const ground=BABYLON.MeshBuilder.CreateGround('ground',{width:560,height:560},scene),gm=new BABYLON.StandardMaterial('groundMat',scene);gm.diffuseColor=new BABYLON.Color3(.29,.235,.145);gm.specularColor=BABYLON.Color3.Black();ground.material=gm;
const tex=(file,alpha=true)=>{const t=new BABYLON.Texture(A+file,scene,true,false,BABYLON.Texture.TRILINEAR_SAMPLINGMODE);t.hasAlpha=alpha;t.wrapU=t.wrapV=BABYLON.Texture.CLAMP_ADDRESSMODE;t.anisotropicFilteringLevel=8;return t};
BABYLON.Effect.ShadersStore.nearVertexShader=`precision highp float;attribute vec3 position;attribute vec2 uv;attribute vec4 world0;attribute vec4 world1;attribute vec4 world2;attribute vec4 world3;attribute float instanceSeed;uniform mat4 viewProjection;uniform vec3 cameraPosition;uniform float uTime;uniform float uWind;varying vec2 vUV;varying float vD;void main(){vec3 lp=position;float h=clamp(abs(lp.y),0.,1.);h*=h;float ph=uTime*1.2+instanceSeed*6.283;float f=sin(ph*1.71+instanceSeed*9.7);lp.x+=(sin(ph)*.72+f*.28)*.07*uWind*h;lp.z+=f*.018*uWind*h;vec4 wp=mat4(world0,world1,world2,world3)*vec4(lp,1.);vD=distance(wp.xyz,cameraPosition);gl_Position=viewProjection*wp;vUV=uv;}`;
BABYLON.Effect.ShadersStore.nearFragmentShader=`precision highp float;varying vec2 vUV;varying float vD;uniform sampler2D grassTexture;void main(){if(vD>${NEAR_END.toFixed(1)})discard;vec4 c=texture2D(grassTexture,vUV);if(c.a<.12)discard;gl_FragColor=vec4(c.rgb,1.);}`;
BABYLON.Effect.ShadersStore.lodVertexShader=`precision highp float;attribute vec3 position;attribute vec2 uv;attribute vec4 world0;attribute vec4 world1;attribute vec4 world2;attribute vec4 world3;uniform mat4 viewProjection;uniform vec3 cameraPosition;varying vec2 vUV;varying float vD;void main(){vec3 c=world3.xyz;vec3 t=cameraPosition-c;vD=length(t);t.y=0.;vec3 f=t/max(length(t),.0001);vec3 r=normalize(vec3(f.z,0.,-f.x));float sx=length(world0.xyz),sy=length(world1.xyz);vec3 p=c+r*(position.x*sx)+vec3(0.,1.,0.)*(position.y*sy);gl_Position=viewProjection*vec4(p,1.);vUV=uv;}`;
BABYLON.Effect.ShadersStore.medFragmentShader=`precision highp float;varying vec2 vUV;varying float vD;uniform sampler2D grassTexture;void main(){if(vD<${NEAR_END.toFixed(1)}||vD>${MED_END.toFixed(1)})discard;vec4 c=texture2D(grassTexture,vUV);if(c.a<.12)discard;gl_FragColor=vec4(c.rgb,1.);}`;
BABYLON.Effect.ShadersStore.farFragmentShader=`precision highp float;varying vec2 vUV;varying float vD;uniform sampler2D grassTexture;void main(){if(vD<${FAR_START.toFixed(1)}||vD>${FAR_END.toFixed(1)})discard;vec4 c=texture2D(grassTexture,vUV);if(c.a<.10)discard;gl_FragColor=vec4(c.rgb,1.);}`;
BABYLON.Effect.ShadersStore.patchVertexShader=`precision highp float;attribute vec3 position;attribute vec2 uv;attribute vec4 world0;attribute vec4 world1;attribute vec4 world2;attribute vec4 world3;uniform mat4 viewProjection;uniform vec3 cameraPosition;varying vec2 vUV;varying float vD;void main(){vec4 wp=mat4(world0,world1,world2,world3)*vec4(position,1.);vD=distance(wp.xyz,cameraPosition);gl_Position=viewProjection*wp;vUV=uv;}`;
BABYLON.Effect.ShadersStore.patchFragmentShader=`precision highp float;varying vec2 vUV;varying float vD;uniform sampler2D fillTexture;void main(){if(vD>${NEAR_END.toFixed(1)})discard;vec2 p=vUV-.5;float fade=1.-smoothstep(.42,1.,length(p)*2.);vec4 c=texture2D(fillTexture,vUV);float a=fade*.82;if(a<.025)discard;gl_FragColor=vec4(c.rgb,a);}`;
function makeNear(def,i){const y=def.height*(def.ground-.5),a=BABYLON.MeshBuilder.CreatePlane('na'+i,{width:def.width,height:-def.height,sideOrientation:BABYLON.Mesh.DOUBLESIDE},scene);a.position.y=y;const b=a.clone('nb'+i);b.rotation.y=Math.PI/2;const mesh=BABYLON.Mesh.MergeMeshes([a,b],true,true,undefined,false,true);mesh.isPickable=false;mesh.alwaysSelectAsActiveMesh=true;const m=new BABYLON.ShaderMaterial('nearMat'+i,scene,{vertex:'near',fragment:'near'},{attributes:['position','uv','world0','world1','world2','world3','instanceSeed'],uniforms:['viewProjection','cameraPosition','uTime','uWind'],samplers:['grassTexture'],needAlphaBlending:false});m.backFaceCulling=false;m.setTexture('grassTexture',tex(def.file));mesh.material=m;return{mesh,mat:m}}
function makeBill(def,i,kind){const p=BABYLON.MeshBuilder.CreatePlane(kind+i,{width:def.width,height:-def.height,sideOrientation:BABYLON.Mesh.DOUBLESIDE},scene);p.position.y=def.height*(def.ground-.5);p.bakeCurrentTransformIntoVertices();p.position.set(0,0,0);p.isPickable=false;p.alwaysSelectAsActiveMesh=true;const m=new BABYLON.ShaderMaterial(kind+'Mat'+i,scene,{vertex:'lod',fragment:kind==='med'?'med':'far'},{attributes:['position','uv','world0','world1','world2','world3'],uniforms:['viewProjection','cameraPosition'],samplers:['grassTexture'],needAlphaBlending:false});m.backFaceCulling=false;m.setTexture('grassTexture',tex(def.file));p.material=m;return{mesh:p,mat:m}}
const nearTypes=V.map(makeNear),medTypes=V.map((d,i)=>makeBill(d,i,'med')),farTypes=V.map((d,i)=>makeBill(d,i,'far'));
const nearPatch=BABYLON.MeshBuilder.CreatePlane('nearPatch',{width:.65,height:.65,sideOrientation:BABYLON.Mesh.DOUBLESIDE},scene);nearPatch.rotation.x=Math.PI/2;nearPatch.position.y=.01;nearPatch.bakeCurrentTransformIntoVertices();nearPatch.rotation.set(0,0,0);nearPatch.position.set(0,0,0);nearPatch.isPickable=false;nearPatch.alwaysSelectAsActiveMesh=true;const patchMat=new BABYLON.ShaderMaterial('patchMat',scene,{vertex:'patch',fragment:'patch'},{attributes:['position','uv','world0','world1','world2','world3'],uniforms:['viewProjection','cameraPosition'],samplers:['fillTexture'],needAlphaBlending:true});patchMat.backFaceCulling=false;patchMat.setTexture('fillTexture',tex('filltex.png',false));nearPatch.material=patchMat;
function hash2D(x,z){let h=(Math.imul(x,374761393)+Math.imul(z,668265263))|0;h=(h^(h>>>13))>>>0;h=Math.imul(h,1274126177)>>>0;return(h^(h>>>16))>>>0}function rng(seed){return()=>{seed=(Math.imul(seed,1664525)+1013904223)>>>0;return seed/4294967296}}
function perChunkCount(){return Math.max(1,Math.round((+density.value/(REFERENCE_FIELD*REFERENCE_FIELD))*CHUNK*CHUNK))}
function generateChunk(cx,cz,count){const r=rng(hash2D(cx,cz)),out=new Array(count),ox=cx*CHUNK,oz=cz*CHUNK;for(let i=0;i<count;i++){out[i]={x:ox+r()*CHUNK,z:oz+r()*CHUNK,v:i%6,yaw:r()*Math.PI*2,s:.70+r()*.48,h:.82+r()*.30,seed:r()}}return out}
const M=new BABYLON.Matrix(),S=new BABYLON.Vector3(),Q=new BABYLON.Quaternion(),P=new BABYLON.Vector3();function matrixFor(g){S.set(g.s,g.s*g.h,g.s);BABYLON.Quaternion.RotationYawPitchRollToRef(g.yaw,0,0,Q);P.set(g.x,0,g.z);BABYLON.Matrix.ComposeToRef(S,Q,P,M);return M}
let lastCx=999999,lastCz=999999,lastDensity=-1,rebuilding=false;function rebuildWorld(force){const cx=Math.floor(camera.position.x/CHUNK),cz=Math.floor(camera.position.z/CHUNK),den=+density.value;if(!force&&cx===lastCx&&cz===lastCz&&den===lastDensity)return;lastCx=cx;lastCz=cz;lastDensity=den;rebuilding=true;status.textContent='Streaming deterministic chunks…';const count=perChunkCount(),range=Math.ceil((FAR_END+CHUNK*1.5)/CHUNK),all=Array.from({length:6},()=>[]),seeds=Array.from({length:6},()=>[]),far=Array.from({length:6},()=>[]),patch=[];for(let z=cz-range;z<=cz+range;z++){for(let x=cx-range;x<=cx+range;x++){const centerX=(x+.5)*CHUNK,centerZ=(z+.5)*CHUNK,dx=centerX-camera.position.x,dz=centerZ-camera.position.z;if(Math.hypot(dx,dz)>FAR_END+CHUNK*.75)continue;const chunk=generateChunk(x,z,count);for(let i=0;i<chunk.length;i++){const g=chunk[i],mat=matrixFor(g);for(let k=0;k<16;k++)all[g.v].push(mat.m[k]);seeds[g.v].push(g.seed);if(i%7===0)for(let k=0;k<16;k++)far[g.v].push(mat.m[k]);const ps=.85+g.s*.18;S.set(ps,ps,ps);BABYLON.Quaternion.RotationYawPitchRollToRef(g.yaw,0,0,Q);P.set(g.x,.01,g.z);BABYLON.Matrix.ComposeToRef(S,Q,P,M);for(let k=0;k<16;k++)patch.push(M.m[k])}}}
for(let i=0;i<6;i++){const mats=new Float32Array(all[i]),sd=new Float32Array(seeds[i]),fm=new Float32Array(far[i]);nearTypes[i].mesh.thinInstanceSetBuffer('matrix',mats,16,true);nearTypes[i].mesh.thinInstanceSetBuffer('instanceSeed',sd,1,true);medTypes[i].mesh.thinInstanceSetBuffer('matrix',mats,16,true);farTypes[i].mesh.thinInstanceSetBuffer('matrix',fm,16,true)}nearPatch.thinInstanceSetBuffer('matrix',new Float32Array(patch),16,true);rebuilding=false;status.textContent='Ready — world-space chunks '+cx+','+cz+' • '+count+' clumps/chunk'}
function applyDraw(){nearTypes.forEach(t=>t.mesh.setEnabled(drawNear.checked));nearPatch.setEnabled(drawNear.checked);medTypes.forEach(t=>t.mesh.setEnabled(drawMedium.checked));farTypes.forEach(t=>t.mesh.setEnabled(drawFar.checked))}[drawNear,drawMedium,drawFar].forEach(x=>x.addEventListener('change',applyDraw));density.addEventListener('input',()=>{densityLabel.textContent=(+density.value).toLocaleString();rebuildWorld(true)});
const movement={forward:false,back:false,left:false,right:false};document.querySelectorAll('[data-move]').forEach(b=>{const d=b.dataset.move,on=e=>{e.preventDefault();movement[d]=true},off=e=>{e.preventDefault();movement[d]=false};b.addEventListener('pointerdown',on,{passive:false});['pointerup','pointercancel','pointerleave'].forEach(x=>b.addEventListener(x,off,{passive:false}));b.addEventListener('contextmenu',e=>e.preventDefault())});resetBtn.onclick=()=>{camera.position.set(0,1.9,-8);camera.rotation.set(0,0,0);rebuildWorld(true)};fullscreenBtn.onclick=async()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();
let time=0,frame=0;scene.onBeforeRenderObservable.add(()=>{const dt=Math.min(engine.getDeltaTime()/1000,.05);time+=dt;camera.position.y=1.9;ground.position.x=camera.position.x;ground.position.z=camera.position.z;const cp=camera.globalPosition,w=+wind.value;patchMat.setVector3('cameraPosition',cp);for(let i=0;i<6;i++){nearTypes[i].mat.setVector3('cameraPosition',cp);nearTypes[i].mat.setFloat('uTime',time);nearTypes[i].mat.setFloat('uWind',w);medTypes[i].mat.setVector3('cameraPosition',cp);farTypes[i].mat.setVector3('cameraPosition',cp)}const f=camera.getDirection(BABYLON.Axis.Z);f.y=0;f.normalize();const r=camera.getDirection(BABYLON.Axis.X);r.y=0;r.normalize();const sp=dt*4.3;if(movement.forward)camera.position.addInPlace(f.scale(sp));if(movement.back)camera.position.subtractInPlace(f.scale(sp));if(movement.right)camera.position.addInPlace(r.scale(sp));if(movement.left)camera.position.subtractInPlace(r.scale(sp));if(!rebuilding)rebuildWorld(false)});rebuildWorld(true);applyDraw();engine.runRenderLoop(()=>{scene.render();if(++frame%15===0)fps.textContent='FPS: '+Math.round(engine.getFps())});addEventListener('resize',()=>engine.resize());
</script></body></html>

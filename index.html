<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Grass Demo v18</title><style>html,body{margin:0;width:100%;height:100%;background:#0f141c;color:#fff;font-family:Arial,sans-serif}#load{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:28px;box-sizing:border-box}.loader{width:min(420px,82vw);text-align:center}.title{font-size:24px;margin-bottom:18px}.track{height:10px;border-radius:999px;background:rgba(255,255,255,.14);overflow:hidden;border:1px solid rgba(255,255,255,.12)}#fill{height:100%;width:4%;background:#fff;border-radius:999px;transition:width .22s ease}.meta{margin-top:10px;font-size:13px;color:rgba(255,255,255,.68)}#build{margin-top:20px;letter-spacing:.16em;color:rgba(255,255,255,.45)}</style></head><body><div id="load"><div class="loader"><div class="title" id="loadText">Loading v18 bodycam build…</div><div class="track"><div id="fill"></div></div><div class="meta"><span id="stage">Starting</span> · <span id="pct">4%</span></div><div id="build">BUILD V18</div></div></div><script>(async()=>{const fill=document.getElementById('fill'),pct=document.getElementById('pct'),stage=document.getElementById('stage'),loadText=document.getElementById('loadText');let shown=4;function prog(n,s){shown=n;fill.style.width=n+'%';pct.textContent=n+'%';stage.textContent=s}async function grab(url,ms){const c=new AbortController(),t=setTimeout(()=>c.abort(),ms);try{const r=await fetch(url,{cache:'no-store',signal:c.signal});if(!r.ok)throw new Error('HTTP '+r.status);return await r.text()}finally{clearTimeout(t)}}async function fallback(urls,label){let err;for(let i=0;i<urls.length;i++){try{stage.textContent=label+(i?' — fallback':'');return await grab(urls[i],8000)}catch(e){err=e}}throw err||new Error(label+' failed')}try{prog(10,'Connecting to CDN');const coreUrls=['https://cdn.jsdelivr.net/gh/Teethree89/grasstex@bcd3d757ccd4979a02561601908073f42d844a04/index.html','https://raw.githubusercontent.com/Teethree89/grasstex/bcd3d757ccd4979a02561601908073f42d844a04/index.html?ts='+Date.now()];const camUrls=['https://cdn.jsdelivr.net/gh/Teethree89/grasstex@8f956fbdd0c73f6b1535f4124353d680fc83ee26/bodycam.js','https://raw.githubusercontent.com/Teethree89/grasstex/8f956fbdd0c73f6b1535f4124353d680fc83ee26/bodycam.js?ts='+Date.now()];prog(24,'Downloading world build');let html=await fallback(coreUrls,'World build');prog(66,'Downloading bodycam camera');const cam=await fallback(camUrls,'Bodycam camera');prog(86,'Preparing scene');html=html.replace('<strong>Version:</strong> v15','<strong>Version:</strong> v18').replace('<strong>Build:</strong> deterministic-world-chunks','<strong>Build:</strong> deterministic-world-chunks + bodycam-camera-v18').replace('</body></html>','<script>'+cam.replace(/<\\/script/gi,'<\\/script')+'<\\/script></body></html>');prog(100,'Starting renderer');setTimeout(()=>{document.open();document.write(html);document.close()},100)}catch(e){fill.style.width='100%';fill.style.background='#c96a6a';loadText.textContent='v18 load failed';stage.textContent=(e&&e.name==='AbortError')?'Network request timed out':(e.message||String(e));pct.textContent='';}})();</script></body></html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Babylon Grass Demo</title>
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover" />
<style>
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#0f141c;font-family:Arial,sans-serif}
#renderCanvas{width:100%;height:100%;display:block;touch-action:none}
#ui{position:absolute;top:12px;left:12px;z-index:10;color:#fff;background:rgba(10,15,12,.74);border:1px solid rgba(255,255,255,.16);border-radius:14px;padding:14px;min-width:280px;max-width:min(88vw,360px);backdrop-filter:blur(8px)}
#ui h3{margin:0 0 10px;font-size:20px}#ui .row{margin:10px 0;font-size:14px}#ui label{display:block;margin-bottom:4px;font-weight:600}#ui input[type=range]{width:100%}#ui button{padding:8px 12px;border-radius:10px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.12);color:#fff;cursor:pointer}
.draws{display:flex;gap:12px;flex-wrap:wrap}.draws label{display:flex!important;align-items:center;gap:5px;margin:0!important;font-weight:600!important}.draws input{width:18px;height:18px;margin:0}
#status{color:#dce6da;font-size:13px;opacity:.95;line-height:1.4}#barTrack{height:10px;width:100%;background:rgba(255,255,255,.16);border-radius:999px;overflow:hidden;margin-top:8px}#barFill{height:100%;width:0;background:#7dc957;transition:width .08s linear}
#fps,#fullscreenBtn{position:absolute;right:12px;z-index:10;color:#fff;background:rgba(10,15,12,.74);border:1px solid rgba(255,255,255,.16);border-radius:10px;padding:8px 10px;font-size:14px}#fps{top:12px}#fullscreenBtn{top:58px;padding:10px 12px;cursor:pointer}
#help{position:absolute;left:12px;bottom:12px;z-index:10;color:#fff;background:rgba(10,15,12,.74);border:1px solid rgba(255,255,255,.16);border-radius:10px;padding:10px 12px;font-size:13px;line-height:1.4;max-width:60vw}
#pad{position:absolute;right:12px;bottom:12px;z-index:10;display:grid;grid-template-columns:56px 56px 56px;grid-template-rows:56px 56px;gap:6px;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
#pad button{border:1px solid rgba(255,255,255,.22);border-radius:12px;background:rgba(10,15,12,.74);color:#fff;font-size:22px;font-weight:bold;cursor:pointer;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;outline:none}
#pad button::selection{background:transparent}#pad button:focus{outline:none}#pad button:active{background:rgba(255,255,255,.18)}
#pad .up{grid-column:2;grid-row:1}#pad .left{grid-column:1;grid-row:2}#pad .down{grid-column:2;grid-row:2}#pad .right{grid-column:3;grid-row:2}
</style>
</head>
<body>
<canvas id="renderCanvas"></canvas>
<div id="ui">
  <h3>Grass Field Demo</h3>
  <div class="row"><strong>Version:</strong> v8</div>
  <div class="row"><strong>Ground:</strong> dirt + grass patches</div>
  <div class="row"><strong>Grass:</strong> 6 variants</div>
  <div class="row"><strong>Draw layers</strong><div class="draws"><label><input id="drawNear" type="checkbox" checked>Near</label><label><input id="drawMedium" type="checkbox" checked>Medium</label><label><input id="drawFar" type="checkbox" checked>Far</label></div></div>
  <div class="row"><label for="density">Density (<span id="densityLabel">50,000</span>)</label><input id="density" type="range" min="5000" max="450000" step="5000" value="50000" /></div>
  <div class="row"><label for="wind">Wind Strength</label><input id="wind" type="range" min="0" max="1.5" step="0.05" value="0.45" /></div>
  <div class="row"><button id="resetBtn">Reset View</button></div>
  <div id="status">Loading…</div><div id="barTrack"><div id="barFill"></div></div>
</div>
<div id="fps">FPS: --</div><button id="fullscreenBtn">Fullscreen</button>
<div id="help"><div><strong>Desktop:</strong> WASD + drag mouse</div><div><strong>Phone:</strong> drag to look + arrow buttons</div></div>
<div id="pad"><button class="up" data-move="forward" aria-label="Move forward">▲</button><button class="left" data-move="left" aria-label="Move left">◀</button><button class="down" data-move="back" aria-label="Move backward">▼</button><button class="right" data-move="right" aria-label="Move right">▶</button></div>
<script src="https://cdn.jsdelivr.net/npm/babylonjs@8.26.0/babylon.js"></script>
<script src="https://cdn.jsdelivr.net/npm/babylonjs-materials@8.26.0/babylonjs.materials.min.js"></script>
<script>
if(location.protocol==="http:")location.replace("https://"+location.host+location.pathname+location.search+location.hash);
const ASSET_ROOT="https://test.ivandpopov.com/grasstex/Assets/";
const GRASS_VARIANTS=[
{file:"grasstex0.png",ground:0.991,width:0.66,height:1.00},
{file:"grasstex1.png",ground:0.956,width:0.72,height:1.04},
{file:"grasstex2.png",ground:0.961,width:0.70,height:1.10},
{file:"grasstex3.png",ground:0.979,width:0.76,height:0.98},
{file:"grasstex4.png",ground:0.967,width:0.74,height:1.06},
{file:"grasstex5.png",ground:0.970,width:0.71,height:1.02}
];
const FILL_TEXTURE_URL=ASSET_ROOT+"filltex.png";
const MAX_GRASS=450000,START_GRASS=50000,FAR_COUNT=18000,PATCH_COUNT=9000,FIELD_SIZE=480;
const canvas=document.getElementById("renderCanvas"),densityEl=document.getElementById("density"),densityLabelEl=document.getElementById("densityLabel"),windEl=document.getElementById("wind"),resetBtn=document.getElementById("resetBtn"),fullscreenBtn=document.getElementById("fullscreenBtn"),fpsEl=document.getElementById("fps"),statusEl=document.getElementById("status"),barFill=document.getElementById("barFill"),drawNear=document.getElementById("drawNear"),drawMedium=document.getElementById("drawMedium"),drawFar=document.getElementById("drawFar");
const engine=new BABYLON.Engine(canvas,true,{antialias:true,preserveDrawingBuffer:false,stencil:false});
const scene=new BABYLON.Scene(engine);scene.clearColor=new BABYLON.Color4(.54,.72,.85,1);scene.fogMode=BABYLON.Scene.FOGMODE_EXP2;scene.fogDensity=.0038;scene.fogColor=new BABYLON.Color3(.54,.72,.85);
const camera=new BABYLON.FreeCamera("camera",new BABYLON.Vector3(0,1.9,-8),scene);camera.minZ=.05;camera.maxZ=600;camera.speed=.4;camera.angularSensibility=4000;camera.keysUp=[87];camera.keysDown=[83];camera.keysLeft=[65];camera.keysRight=[68];camera.attachControl(canvas,true);
const hemi=new BABYLON.HemisphericLight("hemi",new BABYLON.Vector3(.15,1,.2),scene);hemi.intensity=.9;hemi.groundColor=new BABYLON.Color3(.12,.16,.06);const sun=new BABYLON.DirectionalLight("sun",new BABYLON.Vector3(-.5,-1,.25),scene);sun.intensity=.7;
const ground=BABYLON.MeshBuilder.CreateGround("ground",{width:500,height:500,subdivisions:2},scene);const groundMat=new BABYLON.StandardMaterial("groundMat",scene);groundMat.diffuseColor=new BABYLON.Color3(.29,.235,.145);groundMat.specularColor=BABYLON.Color3.Black();ground.material=groundMat;
const patch=BABYLON.MeshBuilder.CreatePlane("grassPatch",{width:2.6,height:2.6,sideOrientation:BABYLON.Mesh.DOUBLESIDE},scene);patch.rotation.x=Math.PI/2;patch.position.y=.012;patch.bakeCurrentTransformIntoVertices();patch.rotation.set(0,0,0);patch.position.set(0,0,0);patch.isPickable=false;patch.alwaysSelectAsActiveMesh=true;
const fillTexture=new BABYLON.Texture(FILL_TEXTURE_URL,scene,true,false,BABYLON.Texture.TRILINEAR_SAMPLINGMODE);fillTexture.wrapU=BABYLON.Texture.CLAMP_ADDRESSMODE;fillTexture.wrapV=BABYLON.Texture.CLAMP_ADDRESSMODE;fillTexture.anisotropicFilteringLevel=8;
BABYLON.Effect.ShadersStore.patchVertexShader=`precision highp float;attribute vec3 position;attribute vec2 uv;attribute vec4 world0;attribute vec4 world1;attribute vec4 world2;attribute vec4 world3;uniform mat4 viewProjection;varying vec2 vUV;void main(){mat4 iw=mat4(world0,world1,world2,world3);gl_Position=viewProjection*iw*vec4(position,1.0);vUV=uv;}`;
BABYLON.Effect.ShadersStore.patchFragmentShader=`precision highp float;varying vec2 vUV;uniform sampler2D fillTexture;void main(){vec2 p=vUV-0.5;float r=length(p)*2.0;float fade=1.0-smoothstep(0.48,1.0,r);vec4 c=texture2D(fillTexture,vUV*2.2);float a=fade*0.78;if(a<0.035)discard;gl_FragColor=vec4(c.rgb,a);}`;
const patchMat=new BABYLON.ShaderMaterial("patchMat",scene,{vertex:"patch",fragment:"patch"},{attributes:["position","uv","world0","world1","world2","world3"],uniforms:["viewProjection"],samplers:["fillTexture"],needAlphaBlending:true});patchMat.backFaceCulling=false;patchMat.setTexture("fillTexture",fillTexture);patch.material=patchMat;
let patchSeed=991;function patchRand(){patchSeed=(patchSeed*1664525+1013904223)>>>0;return patchSeed/4294967296}const patchMatrices=new Float32Array(PATCH_COUNT*16),pm=new BABYLON.Matrix(),ps=new BABYLON.Vector3(),pq=new BABYLON.Quaternion(),pp=new BABYLON.Vector3();for(let i=0;i<PATCH_COUNT;i++){const x=(patchRand()-.5)*FIELD_SIZE,z=(patchRand()-.5)*FIELD_SIZE,s=.55+patchRand()*1.15;ps.set(s,s,s);BABYLON.Quaternion.RotationYawPitchRollToRef(patchRand()*Math.PI*2,0,0,pq);pp.set(x,.012,z);BABYLON.Matrix.ComposeToRef(ps,pq,pp,pm);pm.copyToArray(patchMatrices,i*16)}patch.thinInstanceSetBuffer("matrix",patchMatrices,16,true);

// Far draw: six billboarded grass textures packed side-by-side in the distance.
const farTypes=[];
BABYLON.Effect.ShadersStore.farGrassVertexShader=`precision highp float;attribute vec3 position;attribute vec2 uv;attribute vec4 world0;attribute vec4 world1;attribute vec4 world2;attribute vec4 world3;uniform mat4 viewProjection;uniform vec3 cameraPosition;varying vec2 vUV;varying float vDistance;void main(){vec3 center=world3.xyz;float sx=length(world0.xyz),sy=length(world1.xyz);vec3 toCam=cameraPosition-center;vDistance=length(toCam);toCam.y=0.0;float len=max(length(toCam),0.0001);vec3 forward=toCam/len;vec3 right=normalize(vec3(forward.z,0.0,-forward.x));vec3 worldPos=center+right*(position.x*sx)+vec3(0.0,1.0,0.0)*(position.y*sy);gl_Position=viewProjection*vec4(worldPos,1.0);vUV=uv;}`;
BABYLON.Effect.ShadersStore.farGrassFragmentShader=`precision highp float;varying vec2 vUV;varying float vDistance;uniform sampler2D grassTexture;void main(){vec4 c=texture2D(grassTexture,vUV);float nearFade=smoothstep(150.0,178.0,vDistance);float farFade=1.0-smoothstep(242.0,258.0,vDistance);float a=c.a*nearFade*farFade;if(a<0.10)discard;gl_FragColor=vec4(c.rgb,1.0);}`;
function makeFarType(def,index){const plane=BABYLON.MeshBuilder.CreatePlane("farGrass"+index,{width:def.width*.92,height:-def.height*.82,sideOrientation:BABYLON.Mesh.DOUBLESIDE},scene);plane.position.y=def.height*.82*(def.ground-.5);plane.bakeCurrentTransformIntoVertices();plane.position.set(0,0,0);plane.isPickable=false;plane.alwaysSelectAsActiveMesh=true;const tex=new BABYLON.Texture(ASSET_ROOT+def.file,scene,true,false,BABYLON.Texture.TRILINEAR_SAMPLINGMODE);tex.hasAlpha=true;tex.wrapU=BABYLON.Texture.CLAMP_ADDRESSMODE;tex.wrapV=BABYLON.Texture.CLAMP_ADDRESSMODE;tex.anisotropicFilteringLevel=8;const mat=new BABYLON.ShaderMaterial("farMat"+index,scene,{vertex:"farGrass",fragment:"farGrass"},{attributes:["position","uv","world0","world1","world2","world3"],uniforms:["viewProjection","cameraPosition"],samplers:["grassTexture"],needAlphaBlending:false});mat.backFaceCulling=false;mat.setTexture("grassTexture",tex);plane.material=mat;return{mesh:plane,mat,tex,matrices:[],count:0}}
for(let i=0;i<GRASS_VARIANTS.length;i++)farTypes.push(makeFarType(GRASS_VARIANTS[i],i));
let farSeed=7331;function farRand(){farSeed=(farSeed*1664525+1013904223)>>>0;return farSeed/4294967296}
const farRaw=Array.from({length:GRASS_VARIANTS.length},()=>[]),fm=new BABYLON.Matrix(),fs=new BABYLON.Vector3(),fq=new BABYLON.Quaternion(),fp=new BABYLON.Vector3();
const FAR_MIN=165,FAR_MAX=238,ROW_SPACING=.72;
for(let i=0;i<FAR_COUNT;i++){
  const row=i%3;
  const angle=(i/FAR_COUNT)*Math.PI*2*3 + row*.016;
  const radius=FAR_MIN+row*ROW_SPACING+(farRand()-.5)*.22;
  const x=Math.cos(angle)*radius,z=Math.sin(angle)*radius;
  const ti=i%GRASS_VARIANTS.length,t=farTypes[ti],def=GRASS_VARIANTS[ti];
  const sx=.82+farRand()*.18,sy=.82+farRand()*.14;
  fs.set(sx,sy,sx);BABYLON.Quaternion.RotationYawPitchRollToRef(0,0,0,fq);fp.set(x,0,z);BABYLON.Matrix.ComposeToRef(fs,fq,fp,fm);
  const arr=farRaw[ti];for(let k=0;k<16;k++)arr.push(fm.m[k]);
}
for(let i=0;i<farTypes.length;i++){const arr=new Float32Array(farRaw[i]);farTypes[i].mesh.thinInstanceSetBuffer("matrix",arr,16,true);farTypes[i].count=arr.length/16}

const TYPE_CAP=Math.ceil(MAX_GRASS/GRASS_VARIANTS.length)+32,grassTypes=[];
function makeGrassType(def,index){const yOrigin=def.height*(def.ground-.5);const a=BABYLON.MeshBuilder.CreatePlane("grassA"+index,{width:def.width,height:-def.height,sideOrientation:BABYLON.Mesh.DOUBLESIDE},scene);a.position.y=yOrigin;const b=a.clone("grassB"+index);b.rotation.y=Math.PI/2;const mesh=BABYLON.Mesh.MergeMeshes([a,b],true,true,undefined,false,true);mesh.isPickable=false;mesh.alwaysSelectAsActiveMesh=true;const tex=new BABYLON.Texture(ASSET_ROOT+def.file,scene,true,false,BABYLON.Texture.TRILINEAR_SAMPLINGMODE);tex.hasAlpha=true;tex.wrapU=BABYLON.Texture.CLAMP_ADDRESSMODE;tex.wrapV=BABYLON.Texture.CLAMP_ADDRESSMODE;tex.anisotropicFilteringLevel=8;let mat;if(BABYLON.CustomMaterial){mat=new BABYLON.CustomMaterial("grassMat"+index,scene);mat.diffuseTexture=tex;mat.useAlphaFromDiffuseTexture=true;mat.transparencyMode=BABYLON.Material.MATERIAL_ALPHATEST;mat.alphaCutOff=.12;mat.backFaceCulling=false;mat.specularColor=BABYLON.Color3.Black();mat.emissiveColor=new BABYLON.Color3(.012,.021,.004);mat.AddUniform("uTime","float",0);mat.AddUniform("uWindStrength","float",.45);mat.AddAttribute("instanceSeed");mat.Vertex_Definitions(`attribute float instanceSeed;`);mat.Vertex_Before_PositionUpdated(`float grassHeight=clamp(abs(positionUpdated.y)/${def.height.toFixed(4)},0.0,1.0);grassHeight*=grassHeight;float phase=uTime*1.20+instanceSeed*6.2831853+${(index*0.73).toFixed(3)};float broad=sin(phase);float fine=sin(phase*1.71+instanceSeed*9.7);float sway=broad*.72+fine*.28;positionUpdated.x+=sway*.070*uWindStrength*grassHeight;positionUpdated.z+=fine*.018*uWindStrength*grassHeight;`)}else{mat=new BABYLON.StandardMaterial("grassMat"+index,scene);mat.diffuseTexture=tex;mat.useAlphaFromDiffuseTexture=true;mat.transparencyMode=BABYLON.Material.MATERIAL_ALPHATEST;mat.alphaCutOff=.12;mat.backFaceCulling=false;mat.specularColor=BABYLON.Color3.Black()}mesh.material=mat;return{def,index,mesh,mat,tex,matrices:new Float32Array(TYPE_CAP*16),seeds:new Float32Array(TYPE_CAP),count:0}}
for(let i=0;i<GRASS_VARIANTS.length;i++)grassTypes.push(makeGrassType(GRASS_VARIANTS[i],i));
function applyDrawLayers(){const nearOn=drawNear.checked,mediumOn=drawMedium.checked,farOn=drawFar.checked;for(const t of grassTypes)t.mesh.setEnabled(nearOn);patch.setEnabled(mediumOn);for(const t of farTypes)t.mesh.setEnabled(farOn);statusEl.textContent=`Draws — Near ${nearOn?"ON":"OFF"} / Medium ${mediumOn?"ON":"OFF"} / Far ${farOn?"ON":"OFF"}`}
drawNear.addEventListener("change",applyDrawLayers);drawMedium.addEventListener("change",applyDrawLayers);drawFar.addEventListener("change",applyDrawLayers);applyDrawLayers();
let seed=1944;function rand(){seed=(seed*1664525+1013904223)>>>0;return seed/4294967296}const matrix=new BABYLON.Matrix(),scaling=new BABYLON.Vector3(),rotation=new BABYLON.Quaternion(),position=new BABYLON.Vector3();let built=0,buffersReady=false;
function buildChunk(){const CHUNK_SIZE=15000,end=Math.min(built+CHUNK_SIZE,MAX_GRASS);for(let i=built;i<end;i++){const typeIndex=Math.min(GRASS_VARIANTS.length-1,Math.floor(rand()*GRASS_VARIANTS.length)),t=grassTypes[typeIndex],slot=t.count++,x=(rand()-.5)*FIELD_SIZE,z=(rand()-.5)*FIELD_SIZE,size=.70+rand()*.48,heightVariation=.82+rand()*.30;scaling.set(size,size*heightVariation,size);BABYLON.Quaternion.RotationYawPitchRollToRef(rand()*Math.PI*2,0,0,rotation);position.set(x,0,z);BABYLON.Matrix.ComposeToRef(scaling,rotation,position,matrix);matrix.copyToArray(t.matrices,slot*16);t.seeds[slot]=rand()}built=end;barFill.style.width=Math.round(built/MAX_GRASS*100)+"%";statusEl.textContent="Planting "+built.toLocaleString()+" / "+MAX_GRASS.toLocaleString();if(built<MAX_GRASS){setTimeout(buildChunk,0);return}for(const t of grassTypes){t.mesh.thinInstanceSetBuffer("matrix",t.matrices.subarray(0,t.count*16),16,true);if(BABYLON.CustomMaterial)t.mesh.thinInstanceSetBuffer("instanceSeed",t.seeds.subarray(0,t.count),1,true)}buffersReady=true;setDensity(START_GRASS);applyDrawLayers();statusEl.textContent="Ready — "+START_GRASS.toLocaleString()+" clumps across 6 variants"}
buildChunk();
function setDensity(amount){if(!buffersReady)return;let shown=0;for(let i=0;i<grassTypes.length;i++){const t=grassTypes[i],target=i===grassTypes.length-1?Math.max(0,amount-shown):Math.floor(amount*(t.count/MAX_GRASS)),clamped=Math.min(t.count,target);t.mesh.thinInstanceCount=clamped;shown+=clamped}}
densityEl.addEventListener("input",()=>{const amount=Math.max(5000,Math.min(MAX_GRASS,Number(densityEl.value)||START_GRASS));densityLabelEl.textContent=amount.toLocaleString();setDensity(amount);statusEl.textContent="Showing "+amount.toLocaleString()+" grass clumps"});
const movement={forward:false,back:false,left:false,right:false};document.querySelectorAll("[data-move]").forEach(button=>{const d=button.dataset.move,start=e=>{e.preventDefault();e.stopPropagation();movement[d]=true;canvas.focus({preventScroll:true})},stop=e=>{e.preventDefault();e.stopPropagation();movement[d]=false};button.addEventListener("pointerdown",start,{passive:false});button.addEventListener("pointerup",stop,{passive:false});button.addEventListener("pointercancel",stop,{passive:false});button.addEventListener("pointerleave",stop,{passive:false});button.addEventListener("contextmenu",e=>e.preventDefault())});
resetBtn.addEventListener("click",()=>{camera.position.set(0,1.9,-8);camera.rotation.set(0,0,0);canvas.focus()});fullscreenBtn.addEventListener("click",async()=>{if(!document.fullscreenElement)await document.documentElement.requestFullscreen();else await document.exitFullscreen()});
let time=0;scene.onBeforeRenderObservable.add(()=>{const dt=Math.min(engine.getDeltaTime()/1000,.05);time+=dt;camera.position.y=1.9;for(const t of farTypes)t.mat.setVector3("cameraPosition",camera.globalPosition);if(BABYLON.CustomMaterial){const strength=Number(windEl.value)||0;for(const t of grassTypes){const effect=t.mat.getEffect();if(effect){effect.setFloat("uTime",time);effect.setFloat("uWindStrength",strength)}}}const forward=camera.getDirection(BABYLON.Axis.Z);forward.y=0;forward.normalize();const right=camera.getDirection(BABYLON.Axis.X);right.y=0;right.normalize();const speed=dt*4.3;if(movement.forward)camera.position.addInPlace(forward.scale(speed));if(movement.back)camera.position.subtractInPlace(forward.scale(speed));if(movement.right)camera.position.addInPlace(right.scale(speed));if(movement.left)camera.position.subtractInPlace(right.scale(speed));camera.position.x=Math.max(-235,Math.min(235,camera.position.x));camera.position.z=Math.max(-235,Math.min(235,camera.position.z))});
let frame=0;engine.runRenderLoop(()=>{scene.render();frame++;if(frame%15===0)fpsEl.textContent="FPS: "+Math.round(engine.getFps())});window.addEventListener("resize",()=>engine.resize());
</script>
</body>
</html>

<text x="56" y="30" font-size="17" font-weight="600" fill="#0b0b0b">Material splat — RGBA8, four weights that sum to 1</text>
<text x="56" y="49" font-size="12.5" fill="#52514e">One class attribute per SVG path drives both this texture and the cross-section geometry. Weights blend legally; material IDs would not.</text>
